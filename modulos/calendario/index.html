<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendario | Kit Gestión Asesoría</title>

  <link rel="stylesheet" href="../../css/styles.css">
</head>

<body>

  <header class="topbar">
    <div class="topbar-left">
      <a href="../../index.html" class="back-link">
        ← Volver al panel
      </a>

      <h1>Calendario</h1>
    </div>

    <div class="topbar-right">
      <span id="usuarioNombre"></span>
      <button id="cerrarSesion" class="logout-btn">
        Cerrar sesión
      </button>
    </div>
  </header>


  <main class="main-content">

    <section class="page-header">
      <div>
        <h2>Calendario / Agenda</h2>
        <p>
          Consulta y gestiona los eventos de la agenda.
        </p>
      </div>

      <button id="btnNuevoEvento" class="primary-btn">
        + Nuevo evento
      </button>
    </section>


    <section class="calendar-container">

      <div class="calendar-toolbar">

        <button id="btnAnterior" class="secondary-btn">
          ← Anterior
        </button>

        <h3 id="mesActual"></h3>

        <button id="btnSiguiente" class="secondary-btn">
          Siguiente →
        </button>

      </div>


      <div class="calendar-weekdays">
        <div>Lunes</div>
        <div>Martes</div>
        <div>Miércoles</div>
        <div>Jueves</div>
        <div>Viernes</div>
        <div>Sábado</div>
        <div>Domingo</div>
      </div>


      <div id="calendario" class="calendar-grid">
        <!-- Los días se generan mediante JavaScript -->
      </div>

    </section>


    <section class="events-section">

      <div class="section-header">
        <h2>Próximos eventos</h2>
      </div>

      <div id="listaEventos" class="events-list">
        <!-- Los eventos se generan mediante JavaScript -->
      </div>

    </section>

  </main>


  <!-- Modal crear / editar evento -->

  <div id="modalEvento" class="modal hidden">

    <div class="modal-content">

      <div class="modal-header">
        <h2 id="modalTitulo">Nuevo evento</h2>

        <button id="cerrarModal" class="modal-close">
          ×
        </button>
      </div>


      <form id="formEvento">

        <input
          type="hidden"
          id="eventoId"
        >


        <div class="form-group">

          <label for="titulo">
            Título
          </label>

          <input
            type="text"
            id="titulo"
            name="titulo"
            required
          >

        </div>


        <div class="form-group">

          <label for="descripcion">
            Descripción
          </label>

          <textarea
            id="descripcion"
            name="descripcion"
            rows="4"
          ></textarea>

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="tipo">
              Tipo
            </label>

            <select id="tipo" name="tipo">

              <option value="REUNION">
                Reunión
              </option>

              <option value="CITA">
                Cita
              </option>

              <option value="LLAMADA">
                Llamada
              </option>

              <option value="PLAZO">
                Plazo
              </option>

              <option value="OTRO">
                Otro
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="estado">
              Estado
            </label>

            <select id="estado" name="estado">

              <option value="PROGRAMADO">
                Programado
              </option>

              <option value="COMPLETADO">
                Completado
              </option>

              <option value="CANCELADO">
                Cancelado
              </option>

            </select>

          </div>

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="fechaInicio">
              Fecha y hora de inicio
            </label>

            <input
              type="datetime-local"
              id="fechaInicio"
              name="fechaInicio"
              required
            >

          </div>


          <div class="form-group">

            <label for="fechaFin">
              Fecha y hora de fin
            </label>

            <input
              type="datetime-local"
              id="fechaFin"
              name="fechaFin"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label for="ubicacion">
            Ubicación
          </label>

          <input
            type="text"
            id="ubicacion"
            name="ubicacion"
          >

        </div>


        <div class="form-group">

          <label for="empresaId">
            Empresa
          </label>

          <select
            id="empresaId"
            name="empresaId"
            required
          >
            <option value="">
              Seleccionar empresa
            </option>
          </select>

        </div>


        <div class="form-group">

          <label for="oficinaId">
            Oficina
          </label>

          <select
            id="oficinaId"
            name="oficinaId"
          >
            <option value="">
              Sin oficina
            </option>
          </select>

        </div>


        <div class="form-group">

          <label for="clienteId">
            Cliente
          </label>

          <select
            id="clienteId"
            name="clienteId"
          >
            <option value="">
              Sin cliente
            </option>
          </select>

        </div>


        <div class="form-actions">

          <button
            type="button"
            id="btnCancelar"
            class="secondary-btn"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="primary-btn"
          >
            Guardar evento
          </button>

        </div>

      </form>

    </div>

  </div>


  <script src="../../js/auth.js"></script>
  <script src="./calendario.js"></script>

</body>
</html>
