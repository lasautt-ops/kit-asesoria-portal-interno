<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendario | Kit Gestión Asesoría</title>

  <link rel="stylesheet" href="../../css/styles.css">
</head>

<body>

  <header class="topbar">
    <div class="topbar-left">
      <a href="../../index.html" class="back-link">
        ← Volver al panel
      </a>

      <h1>Calendario</h1>
    </div>

    <div class="topbar-right">
      <span id="usuarioNombre"></span>
      <button id="cerrarSesion" class="logout-btn">
        Cerrar sesión
      </button>
    </div>
  </header>


  <main class="main-content">

    <section class="page-header">
      <div>
        <h2>Calendario / Agenda</h2>
        <p>
          Consulta y gestiona los eventos de la agenda.
        </p>
      </div>

      <button id="btnNuevoEvento" class="primary-btn">
        + Nuevo evento
      </button>
    </section>


    <section class="calendar-container">

      <div class="calendar-toolbar">

        <button id="btnAnterior" class="secondary-btn">
          ← Anterior
        </button>

        <h3 id="mesActual"></h3>

        <button id="btnSiguiente" class="secondary-btn">
          Siguiente →
        </button>

      </div>


      <div class="calendar-weekdays">
        <div>Lunes</div>
        <div>Martes</div>
        <div>Miércoles</div>
        <div>Jueves</div>
        <div>Viernes</div>
        <div>Sábado</div>
        <div>Domingo</div>
      </div>


      <div id="calendario" class="calendar-grid">
        <!-- Los días se generan mediante JavaScript -->
      </div>

    </section>


    <section class="events-section">

      <div class="section-header">
        <h2>Próximos eventos</h2>
      </div>

      <div id="listaEventos" class="events-list">
        <!-- Los eventos se generan mediante JavaScript -->
      </div>

    </section>

  </main>


  <!-- Modal crear / editar evento -->

  <div id="modalEvento" class="modal hidden">

    <div class="modal-content">

      <div class="modal-header">
        <h2 id="modalTitulo">Nuevo evento</h2>

        <button id="cerrarModal" class="modal-close">
          ×
        </button>
      </div>


      <form id="formEvento">

        <input
          type="hidden"
          id="eventoId"
        >


        <div class="form-group">

          <label for="titulo">
            Título
          </label>

          <input
            type="text"
            id="titulo"
            name="titulo"
            required
          >

        </div>


        <div class="form-group">

          <label for="descripcion">
            Descripción
          </label>

          <textarea
            id="descripcion"
            name="descripcion"
            rows="4"
          ></textarea>

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="tipo">
              Tipo
            </label>

            <select id="tipo" name="tipo">

              <option value="REUNION">
                Reunión
              </option>

              <option value="CITA">
                Cita
              </option>

              <option value="LLAMADA">
                Llamada
              </option>

              <option value="PLAZO">
                Plazo
              </option>

              <option value="OTRO">
                Otro
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="estado">
              Estado
            </label>

            <select id="estado" name="estado">

              <option value="PROGRAMADO">
                Programado
              </option>

              <option value="COMPLETADO">
                Completado
              </option>

              <option value="CANCELADO">
                Cancelado
              </option>

            </select>

          </div>

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="fechaInicio">
              Fecha y hora de inicio
            </label>

            <input
              type="datetime-local"
              id="fechaInicio"
              name="fechaInicio"
              required
            >

          </div>


          <div class="form-group">

            <label for="fechaFin">
              Fecha y hora de fin
            </label>

            <input
              type="datetime-local"
              id="fechaFin"
              name="fechaFin"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label for="ubicacion">
            Ubicación
          </label>

          <input
            type="text"
            id="ubicacion"
            name="ubicacion"
          >

        </div>


        <div class="form-group">

          <label for="empresaId">
            Empresa
          </label>

          <select
            id="empresaId"
            name="empresaId"
            required
          >
            <option value="">
              Seleccionar empresa
            </option>
          </select>

        </div>


        <div class="form-group">

          <label for="oficinaId">
            Oficina
          </label>

          <select
            id="oficinaId"
            name="oficinaId"
          >
            <option value="">
              Sin oficina
            </option>
          </select>

        </div>


        <div class="form-group">

          <label for="clienteId">
            Cliente
          </label>

          <select
            id="clienteId"
            name="clienteId"
          >
            <option value="">
              Sin cliente
            </option>
          </select>

        </div>


        <div class="form-actions">

          <button
            type="button"
            id="btnCancelar"
            class="secondary-btn"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="primary-btn"
          >
            Guardar evento
          </button>

        </div>

      </form>

    </div>

  </div>


 <!-- =====================================================
     JAVASCRIPT COMÚN
     ===================================================== -->

<script src="../../js/comun.js"></script>


<!-- =====================================================
     JAVASCRIPT DEL MÓDULO
     ===================================================== -->

<script>

  // =====================================================
  // SESIÓN
  // =====================================================

  if (!comprobarSesion()) {

    throw new Error("Sesión no válida");

  }


  const usuario =
    obtenerUsuario();


  document
    .getElementById("usuarioNombre")
    .textContent =
      `${usuario.nombre} · ${usuario.rol}`;


  document
    .getElementById("cerrarSesion")
    .addEventListener(
      "click",
      cerrarSesion
    );



  // =====================================================
  // REFERENCIAS
  // =====================================================

  const empresaId =
    document.getElementById("empresaId");



  // =====================================================
  // CARGAR EMPRESAS
  // =====================================================

  async function cargarEmpresas() {

    try {

      const respuesta =
        await peticionAPI(
          "/api/empresas"
        );


      const datos =
        await respuesta.json();


      if (!respuesta.ok || !datos.ok) {

        throw new Error(
          datos.message ||
          "No se pudieron cargar las empresas"
        );

      }


      const empresas =
        Array.isArray(datos.empresas)
          ? datos.empresas
          : [];


      empresaId.innerHTML = `
        <option value="">
          Seleccionar empresa
        </option>
      `;


      empresas.forEach(
        (empresa) => {

          const option =
            document.createElement("option");

          option.value =
            empresa.id;

          option.textContent =
            empresa.nombre;

          empresaId.appendChild(
            option
          );

        }
      );


    } catch (error) {

      console.error(
        "Error cargando empresas:",
        error
      );

      empresaId.innerHTML = `
        <option value="">
          Error cargando empresas
        </option>
      `;

    }

  }

  const oficinaId =
    document.getElementById("oficinaId");


  const clienteId =
    document.getElementById("clienteId");



  // =====================================================
  // CARGAR OFICINAS DE UNA EMPRESA
  // =====================================================

  async function cargarOficinas(empresaIdValor) {

    oficinaId.innerHTML = `
      <option value="">
        Sin oficina
      </option>
    `;


    clienteId.innerHTML = `
      <option value="">
        Sin cliente
      </option>
    `;


    if (!empresaIdValor) {

      return;

    }


    try {

      const respuesta =
        await peticionAPI(
          `/api/empresas/${empresaIdValor}/oficinas`
        );


      const datos =
        await respuesta.json();


      if (!respuesta.ok || !datos.ok) {

        throw new Error(
          datos.message ||
          "No se pudieron cargar las oficinas"
        );

      }


      const oficinas =
        Array.isArray(datos.oficinas)
          ? datos.oficinas.filter(
              (oficina) =>
                oficina.activo !== false
            )
          : [];


      oficinas.forEach(
        (oficina) => {

          const option =
            document.createElement("option");

          option.value =
            oficina.id;

          option.textContent =
            oficina.nombre;

          oficinaId.appendChild(
            option
          );

        }
      );


    } catch (error) {

      console.error(
        "Error cargando oficinas:",
        error
      );


      oficinaId.innerHTML = `
        <option value="">
          Error cargando oficinas
        </option>
      `;

    }

  }

  // =====================================================
  // PREPARAR EMPRESA SEGÚN ROL
  // =====================================================

  async function prepararEmpresa() {


    // ---------------------------------------------------
    // SUPERADMIN
    // ---------------------------------------------------

    if (
      usuario.rol === "SUPERADMIN"
    ) {

      empresaId.disabled =
        false;

      await cargarEmpresas();

      return;

    }


    // ---------------------------------------------------
    // ADMIN
    // ---------------------------------------------------

    if (
      usuario.rol === "ADMIN"
    ) {

      empresaId.innerHTML = "";

      const option =
        document.createElement("option");

      option.value =
        usuario.empresaId;

      option.textContent =
        "Empresa actual";

      option.selected =
        true;

      empresaId.appendChild(
        option
      );

      empresaId.disabled =
        true;

      return;

    }


    // ---------------------------------------------------
    // DIRECTOR
    // ---------------------------------------------------

    if (
      usuario.rol === "DIRECTOR"
    ) {

      empresaId.innerHTML = "";

      const option =
        document.createElement("option");

      option.value =
        usuario.empresaId;

      option.textContent =
        "Empresa actual";

      option.selected =
        true;

      empresaId.appendChild(
        option
      );

      empresaId.disabled =
        true;

      return;

    }


    // ---------------------------------------------------
    // TRABAJADOR
    // ---------------------------------------------------

    if (
      usuario.rol === "TRABAJADOR"
    ) {

      empresaId.innerHTML = "";

      const option =
        document.createElement("option");

      option.value =
        usuario.empresaId;

      option.textContent =
        "Empresa actual";

      option.selected =
        true;

      empresaId.appendChild(
        option
      );

      empresaId.disabled =
        true;

      return;

    }

  }

  // =====================================================
  // CAMBIO DE EMPRESA
  // =====================================================

  empresaId.addEventListener(
    "change",
    async () => {

      const empresaSeleccionada =
        empresaId.value;


      await cargarOficinas(
        empresaSeleccionada
      );

    }
  );

  // =====================================================
  // ABRIR MODAL NUEVO EVENTO
  // =====================================================

  document
    .getElementById("btnNuevoEvento")
    .addEventListener(
      "click",
      async () => {

        await prepararEmpresa();

        document
          .getElementById("modalEvento")
          .classList.remove("hidden");

      }
    );



  // =====================================================
  // CERRAR MODAL
  // =====================================================

  function cerrarModalEvento() {

    document
      .getElementById("modalEvento")
      .classList.add("hidden");

  }


  document
    .getElementById("cerrarModal")
    .addEventListener(
      "click",
      cerrarModalEvento
    );


  document
    .getElementById("btnCancelar")
    .addEventListener(
      "click",
      cerrarModalEvento
    );



  // =====================================================
  // GUARDAR EVENTO
  // =====================================================

  document
    .getElementById("formEvento")
    .addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const titulo =
          document
            .getElementById("titulo")
            .value
            .trim();


        const descripcion =
          document
            .getElementById("descripcion")
            .value
            .trim();


        const tipo =
          document
            .getElementById("tipo")
            .value;


        const estado =
          document
            .getElementById("estado")
            .value;


        const fechaInicio =
          document
            .getElementById("fechaInicio")
            .value;


        const fechaFin =
          document
            .getElementById("fechaFin")
            .value;


        const ubicacion =
          document
            .getElementById("ubicacion")
            .value
            .trim();


        const empresaIdValor =
          document
            .getElementById("empresaId")
            .value;


        const oficinaId =
          document
            .getElementById("oficinaId")
            .value;


        const clienteId =
          document
            .getElementById("clienteId")
            .value;


        // -----------------------------------------------
        // COMPROBAR DATOS OBLIGATORIOS
        // -----------------------------------------------

        if (!titulo) {

          alert(
            "El título es obligatorio"
          );

          return;

        }


        if (!fechaInicio) {

          alert(
            "La fecha y hora de inicio son obligatorias"
          );

          return;

        }


        if (!fechaFin) {

          alert(
            "La fecha y hora de fin son obligatorias"
          );

          return;

        }


        if (!empresaIdValor) {

          alert(
            "Debes seleccionar una empresa"
          );

          return;

        }


        // -----------------------------------------------
        // COMPROBAR FECHAS
        // -----------------------------------------------

        const inicio =
          new Date(fechaInicio);


        const fin =
          new Date(fechaFin);


        if (
          Number.isNaN(
            inicio.getTime()
          ) ||
          Number.isNaN(
            fin.getTime()
          )
        ) {

          alert(
            "Las fechas introducidas no son válidas"
          );

          return;

        }


        if (fin < inicio) {

          alert(
            "La fecha de fin no puede ser anterior a la fecha de inicio"
          );

          return;

        }


        // -----------------------------------------------
        // DATOS A ENVIAR
        // -----------------------------------------------

        const datosEnviar = {

          titulo,

          descripcion:
            descripcion || null,

          tipo,

          fechaInicio,

          fechaFin,

          todoElDia:
            false,

          ubicacion:
            ubicacion || null,

          estado,

          empresaId:
            empresaIdValor,

          oficinaId:
            oficinaId || null,

          clienteId:
            clienteId || null

        };


        try {

          const respuesta =
            await peticionAPI(
              "/api/eventos-calendario",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(
                    datosEnviar
                  )
              }
            );


          const datos =
            await respuesta.json();


          if (
            !respuesta.ok ||
            !datos.ok
          ) {

            throw new Error(
              datos.message ||
              "No se pudo crear el evento"
            );

          }


          alert(
            "Evento creado correctamente"
          );


          cerrarModalEvento();


          document
            .getElementById("formEvento")
            .reset();


        } catch (error) {

          console.error(
            "Error creando evento:",
            error
          );


          alert(
            error.message ||
            "No se pudo crear el evento"
          );

        }

      }
    );



  // =====================================================
  // CARGA INICIAL
  // =====================================================

  (async () => {

    await prepararEmpresa();

  })();

</script>



</body>
</html>
