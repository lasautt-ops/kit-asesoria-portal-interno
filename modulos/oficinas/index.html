    // =====================================================

    const empresaSelect =

        "nombreOficina"
      );

const direccionOficina =

    "direccionOficina"
  );

const codigoPostalOficina =
  document.getElementById(
    "codigoPostalOficina"
  );

const poblacionOficina =

    "poblacionOficina"
  );

const provinciaOficina =
  document.getElementById(
    "provinciaOficina"
  );

const telefonoOficina =
  document.getElementById(
    "telefonoOficina"
  );

const emailOficina =
  document.getElementById(
    "emailOficina"
  );

const responsableOficina =
  document.getElementById(
    "responsableOficina"
  );

const notasOficina =
  document.getElementById(

    const crearOficinaSection =

    const oficinasSection =

    const oficinasContainer =

    const empresaMessage =
      document.getElementById(

    const crearMessage =

    const listadoMessage =

const editarOficinaSection =
  document.getElementById(

  );

const editarNombreOficina =

  );

const editarDireccionOficina =

  );

const editarCodigoPostalOficina =

  );

const editarPoblacionOficina =

  );

  );

  );

const editarResponsableOficina =

const editarNotasOficina =

const editarMessage =
  document.getElementById(
    "editarMessage"

let oficinaEditandoId = null;
    

    // =====================================================
    // CARGAR EMPRESAS
    // =====================================================

    async function cargarEmpresas() {

      empresaMessage.textContent =
        "Cargando empresas...";


      try {

        const respuesta =
          await peticionAPI(
            "/api/empresas"
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          empresaMessage.textContent =
            datos.message ||
            "No se han podido cargar las empresas.";

          return;
        }


        empresaSelect.innerHTML =
          `
            <option value="">
              Selecciona una empresa
            </option>
          `;


        if (
          !Array.isArray(
            datos.empresas
          ) ||
          datos.empresas.length === 0
        ) {

          empresaMessage.textContent =
            "No hay empresas disponibles.";

          return;
        }


        datos.empresas.forEach(
          empresa => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              empresa.id;


            option.textContent =
              empresa.nombre;


            empresaSelect.appendChild(
              option
            );

          }
        );


        empresaMessage.textContent =
          "";

      } catch (error) {

        console.error(
          "Error cargando empresas:",
          error
        );


        empresaMessage.textContent =
          "No se ha podido conectar con el servidor.";
      }
    }



    // =====================================================
    // CAMBIO DE EMPRESA
    // =====================================================

    empresaSelect.addEventListener(
      "change",
      () => {

        const empresaId =
          empresaSelect.value;


        if (!empresaId) {

          crearOficinaSection.style.display =
            "none";


          oficinasSection.style.display =
            "none";


          oficinasContainer.innerHTML =
            "Selecciona una empresa para ver sus oficinas.";


          return;
        }


        crearOficinaSection.style.display =
          "block";


        oficinasSection.style.display =
          "block";


        cargarOficinas(
          empresaId
        );

      }
    );



    // =====================================================
    // CARGAR OFICINAS
    // =====================================================

    async function cargarOficinas(
      empresaId
    ) {

      oficinasContainer.innerHTML =
        "Cargando oficinas...";


      listadoMessage.textContent =
        "";


      try {

        const respuesta =
          await peticionAPI(
            `/api/empresas/${empresaId}/oficinas`
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          oficinasContainer.innerHTML =
            "";


          listadoMessage.textContent =
            datos.message ||
            "No se han podido cargar las oficinas.";

          return;
        }


        if (
          !Array.isArray(
            datos.oficinas
          ) ||
          datos.oficinas.length === 0
        ) {

          oficinasContainer.innerHTML =
            "<p>No hay oficinas para esta empresa.</p>";

          return;
        }


        oficinasContainer.innerHTML =
          "";


        datos.oficinas.forEach(
          oficina => {

            const article =
              document.createElement(
                "article"
              );


            // =================================================
            // NOMBRE
            // =================================================

            const titulo =
              document.createElement(
                "h3"
              );


            titulo.textContent =
              oficina.nombre;


            // =================================================
            // ESTADO
            // =================================================

            const estado =
              document.createElement(
                "p"
              );


            estado.textContent =
              oficina.activo
                ? "Estado: Activa"
                : "Estado: Inactiva";


            // =================================================
            // FECHA CREACIÓN
            // =================================================

            const fecha =
              document.createElement(
                "p"
              );


            fecha.textContent =
              `Creada: ${
                formatearFecha(
                  oficina.createdAt
                )
              }`;


// =================================================
// BOTÓN EDITAR
// =================================================

const botonEditar =
  document.createElement(
    "button"
  );

botonEditar.type =
  "button";

botonEditar.textContent =
  "Editar oficina";

botonEditar.addEventListener(
  "click",
  () =>
    mostrarFormularioEdicion(
      oficina
    )
);
            
            // =================================================
            // BOTÓN ESTADO
            // =================================================

            const botonEstado =
              document.createElement(
                "button"
              );


            botonEstado.type =
              "button";


            if (oficina.activo) {

              botonEstado.textContent =
                "Desactivar oficina";

              botonEstado.addEventListener(
                "click",
                () =>
                  cambiarEstadoOficina(
                    oficina.id,
                    false
                  )
              );

            } else {

              botonEstado.textContent =
                "Activar oficina";

              botonEstado.addEventListener(
                "click",
                () =>
                  cambiarEstadoOficina(
                    oficina.id,
                    true
                  )
              );

            }


            // =================================================
            // CONSTRUIR OFICINA
            // =================================================

            article.appendChild(
              titulo
            );


            article.appendChild(
              estado
            );


            article.appendChild(
              fecha
            );

            article.appendChild(
              botonEditar
            );


            article.appendChild(
              botonEstado
            );


            oficinasContainer.appendChild(
              article
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando oficinas:",
          error
        );


        oficinasContainer.innerHTML =
          "";


        listadoMessage.textContent =
          "No se ha podido conectar con el servidor.";
      }
    }



    // =====================================================
    // CREAR OFICINA
    // =====================================================

    document
      .getElementById(
        "crearOficina"
      )
      .addEventListener(
        "click",
        crearNuevaOficina
      );


    async function crearNuevaOficina() {

      const empresaId =
        empresaSelect.value;


      const nombre =
        nombreOficina.value.trim();

      const direccion =
  direccionOficina.value.trim();

const codigoPostal =
  codigoPostalOficina.value.trim();

const poblacion =
  poblacionOficina.value.trim();

const provincia =
  provinciaOficina.value.trim();

const telefono =
  telefonoOficina.value.trim();

const email =
  emailOficina.value.trim();

const responsable =
  responsableOficina.value.trim();

const notas =
  notasOficina.value.trim();


      crearMessage.textContent =
        "";


      if (!empresaId) {

        crearMessage.textContent =
          "Selecciona una empresa.";

        return;
      }


      if (!nombre) {

        crearMessage.textContent =
          "El nombre de la oficina es obligatorio.";

        return;
      }


      const boton =
        document.getElementById(
          "crearOficina"
        );


      boton.disabled =
        true;


      boton.textContent =
        "Creando...";


      try {

        const respuesta =
          await peticionAPI(
            "/api/oficinas",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                nombre,
                empresaId,
                direccion,
                codigoPostal,
                poblacion,
                provincia,
                telefono,
                email,
                responsable,
                notas
              })
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          crearMessage.textContent =
            datos.message ||
            "No se ha podido crear la oficina.";

          return;
        }


        nombreOficina.value =
  "";

direccionOficina.value =
  "";

codigoPostalOficina.value =
  "";

poblacionOficina.value =
  "";

provinciaOficina.value =
  "";

telefonoOficina.value =
  "";

emailOficina.value =
  "";

responsableOficina.value =
  "";

notasOficina.value =
  "";


        crearMessage.textContent =
          "Oficina creada correctamente.";


        await cargarOficinas(
          empresaId
        );

      } catch (error) {

        console.error(
          "Error creando oficina:",
          error
        );


        crearMessage.textContent =
          "No se ha podido conectar con el servidor.";

      } finally {

        boton.disabled =
          false;


        boton.textContent =
          "Crear oficina";
      }
    }

// =====================================================
// MOSTRAR FORMULARIO DE EDICIÓN
// =====================================================

function mostrarFormularioEdicion(
  oficina
) {

  oficinaEditandoId =
    oficina.id;

  editarNombreOficina.value =
    oficina.nombre || "";

  editarDireccionOficina.value =
    oficina.direccion || "";

  editarCodigoPostalOficina.value =
    oficina.codigoPostal || "";

  editarPoblacionOficina.value =
    oficina.poblacion || "";

  editarProvinciaOficina.value =
    oficina.provincia || "";

  editarTelefonoOficina.value =
    oficina.telefono || "";

  editarEmailOficina.value =
    oficina.email || "";

  editarResponsableOficina.value =
    oficina.responsable || "";

  editarNotasOficina.value =
    oficina.notas || "";

  editarMessage.textContent =
    "";

  editarOficinaSection.style.display =
    "block";

  editarOficinaSection.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}



// =====================================================
// CANCELAR EDICIÓN
// =====================================================

document
  .getElementById(
    "cancelarEdicionOficina"
  )
  .addEventListener(
    "click",
    () => {

      oficinaEditandoId =
        null;

      editarOficinaSection.style.display =
        "none";

      editarMessage.textContent =
        "";

    }
  );



// =====================================================
// GUARDAR EDICIÓN
// =====================================================

document
  .getElementById(
    "guardarEdicionOficina"
  )
  .addEventListener(
    "click",
    guardarEdicionOficina
  );


async function guardarEdicionOficina() {

  if (!oficinaEditandoId) {

    editarMessage.textContent =
      "No se ha seleccionado ninguna oficina.";

    return;
  }


  const nombre =
    editarNombreOficina.value.trim();


  if (!nombre) {

    editarMessage.textContent =
      "El nombre de la oficina es obligatorio.";

    return;
  }


  const boton =
    document.getElementById(
      "guardarEdicionOficina"
    );


  boton.disabled =
    true;

  boton.textContent =
    "Guardando...";


  editarMessage.textContent =
    "";


  try {

    const respuesta =
      await peticionAPI(
        `/api/oficinas/${oficinaEditandoId}`,
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            nombre,

            direccion:
              editarDireccionOficina.value.trim(),

            codigoPostal:
              editarCodigoPostalOficina.value.trim(),

            poblacion:
              editarPoblacionOficina.value.trim(),

            provincia:
              editarProvinciaOficina.value.trim(),

            telefono:
              editarTelefonoOficina.value.trim(),

            email:
              editarEmailOficina.value.trim(),

            responsable:
              editarResponsableOficina.value.trim(),

            notas:
              editarNotasOficina.value.trim()

          })
        }
      );


    const datos =
      await respuesta.json();


    if (
      !respuesta.ok ||
      !datos.ok
    ) {

      editarMessage.textContent =
        datos.message ||
        "No se ha podido modificar la oficina.";

      return;
    }


    editarMessage.textContent =
      "Oficina modificada correctamente.";


    await cargarOficinas(
      empresaSelect.value
    );


    setTimeout(
      () => {

        editarOficinaSection.style.display =
          "none";

        oficinaEditandoId =
          null;

      },
      800
    );


  } catch (error) {

    console.error(
      "Error modificando oficina:",
      error
    );


    editarMessage.textContent =
      "No se ha podido conectar con el servidor.";

  } finally {

    boton.disabled =
      false;

    boton.textContent =
      "Guardar cambios";
  }
}

    // =====================================================
    // CAMBIAR ESTADO DE OFICINA
    // =====================================================

    async function cambiarEstadoOficina(
      oficinaId,
      activar
    ) {

      const accion =
        activar
          ? "activar"
          : "desactivar";


      try {

        const respuesta =
          await peticionAPI(
            `/api/oficinas/${oficinaId}/${accion}`,
            {
              method: "PATCH"
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          alert(
            datos.message ||
            "No se ha podido cambiar el estado de la oficina."
          );

          return;
        }


        await cargarOficinas(
          empresaSelect.value
        );

      } catch (error) {

        console.error(
          "Error cambiando estado de oficina:",
          error
        );


        alert(
          "No se ha podido conectar con el servidor."
        );
      }
    }



    // =====================================================
    // RECARGAR OFICINAS
    // =====================================================

    document
      .getElementById(
        "recargarOficinas"
      )
      .addEventListener(
        "click",
        () => {

          const empresaId =
            empresaSelect.value;


          if (!empresaId) {

            return;
          }


          cargarOficinas(
            empresaId
          );

        }
      );



    // =====================================================
    // INICIO
    // =====================================================

    cargarEmpresas();

  </script>
