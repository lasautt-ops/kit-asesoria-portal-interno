
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Trabajadores - Gestión Interna</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

</head>


<body>


  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

    <div class="portal-header-left">

      <h1>
        Trabajadores
      </h1>

      <p id="usuarioCabecera">
        Cargando...
      </p>

    </div>


    <div class="portal-header-right">

      <a
        href="../../index.html"
        class="btn"
      >
        ← Volver al portal
      </a>

      <button
        id="cerrarSesion"
        class="btn btn-danger"
        type="button"
      >
        Cerrar sesión
      </button>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main class="portal-container">


    <!-- ===================================================
         BIENVENIDA
         =================================================== -->

    <section class="welcome-section">

      <h2>
        Gestión de trabajadores
      </h2>

      <p>
        Gestiona los trabajadores y sus accesos al sistema.
      </p>

    </section>



    <!-- ===================================================
         CREAR TRABAJADOR
         =================================================== -->

    <section class="dashboard-section">

      <h2>
        Crear trabajador
      </h2>


      <div>

        <label for="nombre">
          Nombre:
        </label>

        <input
          id="nombre"
          type="text"
          placeholder="Nombre completo"
        >

      </div>


      <div>

        <label for="email">
          Email:
        </label>

        <input
          id="email"
          type="email"
          placeholder="correo@ejemplo.com"
        >

      </div>


      <div>

        <label for="password">
          Contraseña:
        </label>

        <input
          id="password"
          type="password"
          placeholder="Mínimo 8 caracteres"
        >

      </div>


      <div>

        <label for="empresaSelect">
          Empresa:
        </label>

        <select id="empresaSelect">

          <option value="">
            Selecciona una empresa
          </option>

        </select>

      </div>


      <div>

        <label for="oficinaSelect">
          Oficina:
        </label>

        <select id="oficinaSelect">

          <option value="">
            Selecciona una oficina
          </option>

        </select>

      </div>


      <button
        id="crearTrabajador"
        class="btn"
        type="button"
      >
        Crear trabajador
      </button>


      <p
        id="crearMessage"
        class="message"
      ></p>

    </section>



    <!-- ===================================================
         LISTADO
         =================================================== -->

    <section class="dashboard-section">

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        "
      >

        <h2>
          Trabajadores
        </h2>


        <button
          id="recargarTrabajadores"
          class="btn"
          type="button"
        >
          Recargar trabajadores
        </button>

      </div>


      <p
        id="listadoMessage"
        class="message"
      ></p>


      <div id="trabajadoresContainer">

        Cargando trabajadores...

      </div>

    </section>


  </main>



  <!-- =====================================================
       PIE
       ===================================================== -->

  <footer class="portal-footer">

    Kit Gestión Asesoría · Gestión Interna

  </footer>



  <!-- =====================================================
       JAVASCRIPT COMÚN
       ===================================================== -->

  <script src="../../js/comun.js"></script>



  <!-- =====================================================
       JAVASCRIPT DEL MÓDULO
       ===================================================== -->

  <script>

    // =====================================================
    // SESIÓN
    // =====================================================

    if (!comprobarSesion()) {

      throw new Error(
        "Sesión no válida"
      );

    }


    const usuario =
      obtenerUsuario();


    document
      .getElementById(
        "usuarioCabecera"
      )
      .textContent =
        `${usuario.nombre} · ${usuario.rol}`;


    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById(
        "cerrarSesion"
      )
      .addEventListener(
        "click",
        cerrarSesion
      );


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const empresaSelect =
      document.getElementById(
        "empresaSelect"
      );


    const oficinaSelect =
      document.getElementById(
        "oficinaSelect"
      );


    const trabajadoresContainer =
      document.getElementById(
        "trabajadoresContainer"
      );


    const crearMessage =
      document.getElementById(
        "crearMessage"
      );


    const listadoMessage =
      document.getElementById(
        "listadoMessage"
      );


    // =====================================================
    // CARGAR EMPRESAS
    // =====================================================

    async function cargarEmpresas() {

      try {

        const respuesta =
          await peticionAPI(
            "/api/empresas"
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          crearMessage.textContent =
            datos.message ||
            "No se han podido cargar las empresas.";

          return;
        }


        empresaSelect.innerHTML =
          `
            <option value="">
              Selecciona una empresa
            </option>
          `;


        datos.empresas.forEach(
          empresa => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              empresa.id;


            option.textContent =
              empresa.nombre;


            empresaSelect.appendChild(
              option
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando empresas:",
          error
        );


        crearMessage.textContent =
          "No se ha podido conectar con el servidor.";
      }
    }



    // =====================================================
    // CARGAR OFICINAS
    // =====================================================

    async function cargarOficinas(
      empresaId
    ) {

      oficinaSelect.innerHTML =
        `
          <option value="">
            Cargando oficinas...
          </option>
        `;


      if (!empresaId) {

        oficinaSelect.innerHTML =
          `
            <option value="">
              Selecciona una oficina
            </option>
          `;

        return;
      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/empresas/${empresaId}/oficinas`
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          oficinaSelect.innerHTML =
            `
              <option value="">
                No se han podido cargar las oficinas
              </option>
            `;

          return;
        }


        oficinaSelect.innerHTML =
          `
            <option value="">
              Selecciona una oficina
            </option>
          `;


        datos.oficinas
          .filter(
            oficina =>
              oficina.activo
          )
          .forEach(
            oficina => {

              const option =
                document.createElement(
                  "option"
                );


              option.value =
                oficina.id;


              option.textContent =
                oficina.nombre;


              oficinaSelect.appendChild(
                option
              );

            }
          );

      } catch (error) {

        console.error(
          "Error cargando oficinas:",
          error
        );


        oficinaSelect.innerHTML =
          `
            <option value="">
              Error cargando oficinas
            </option>
          `;
      }
    }



    // =====================================================
    // CAMBIO DE EMPRESA
    // =====================================================

    empresaSelect.addEventListener(
      "change",
      () => {

        cargarOficinas(
          empresaSelect.value
        );

      }
    );



    // =====================================================
    // CARGAR TRABAJADORES
    // =====================================================

    async function cargarTrabajadores() {

      trabajadoresContainer.innerHTML =
        "Cargando trabajadores...";


      listadoMessage.textContent =
        "";


      try {

        const respuesta =
          await peticionAPI(
            "/api/trabajadores"
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          trabajadoresContainer.innerHTML =
            "";


          listadoMessage.textContent =
            datos.message ||
            "No se han podido cargar los trabajadores.";

          return;
        }


        if (
          !Array.isArray(
            datos.trabajadores
          ) ||
          datos.trabajadores.length === 0
        ) {

          trabajadoresContainer.innerHTML =
            "<p>No hay trabajadores disponibles.</p>";

          return;
        }


        trabajadoresContainer.innerHTML =
          "";


        datos.trabajadores.forEach(
          trabajador => {

            const article =
              document.createElement(
                "article"
              );


            const titulo =
              document.createElement(
                "h3"
              );


            titulo.textContent =
              trabajador.usuario?.nombre ||
              trabajador.nombre ||
              "-";


            const email =
              document.createElement(
                "p"
              );


            email.textContent =
              `Email: ${
                trabajador.usuario?.email ||
                trabajador.email ||
                "-"
              }`;


            const rol =
              document.createElement(
                "p"
              );


            rol.textContent =
              `Rol: ${
                trabajador.usuario?.rol ||
                "-"
              }`;


            const empresa =
              document.createElement(
                "p"
              );


            empresa.textContent =
              `Empresa: ${
                trabajador.empresa?.nombre ||
                "-"
              }`;


            const oficina =
              document.createElement(
                "p"
              );


            oficina.textContent =
              `Oficina: ${
                trabajador.oficina?.nombre ||
                "-"
              }`;


            const estado =
              document.createElement(
                "p"
              );


            estado.textContent =
              trabajador.usuario?.activo
                ? "Estado: Activo"
                : "Estado: Inactivo";


            const boton =
              document.createElement(
                "button"
              );


            boton.type =
              "button";


            boton.textContent =
              "Editar trabajador";


            boton.addEventListener(
              "click",
              () =>
                editarTrabajador(
                  trabajador
                )
            );


            article.appendChild(
              titulo
            );


            article.appendChild(
              email
            );


            article.appendChild(
              rol
            );


            article.appendChild(
              empresa
            );


            article.appendChild(
              oficina
            );


            article.appendChild(
              estado
            );


            article.appendChild(
              boton
            );


            trabajadoresContainer.appendChild(
              article
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando trabajadores:",
          error
        );


        trabajadoresContainer.innerHTML =
          "";


        listadoMessage.textContent =
          "No se ha podido conectar con el servidor.";
      }
    }



    // =====================================================
    // CREAR TRABAJADOR
    // =====================================================

    document
      .getElementById(
        "crearTrabajador"
      )
      .addEventListener(
        "click",
        crearTrabajador
      );


    async function crearTrabajador() {

      const nombre =
        document
          .getElementById("nombre")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const empresaId =
        empresaSelect.value;


      const oficinaId =
        oficinaSelect.value;


      crearMessage.textContent =
        "";


      if (
        !nombre ||
        !email ||
        !password ||
        !empresaId ||
        !oficinaId
      ) {

        crearMessage.textContent =
          "Todos los campos son obligatorios.";

        return;
      }


      if (password.length < 8) {

        crearMessage.textContent =
          "La contraseña debe tener al menos 8 caracteres.";

        return;
      }


      const boton =
        document.getElementById(
          "crearTrabajador"
        );


      boton.disabled =
        true;


      boton.textContent =
        "Creando...";


      try {

        const respuesta =
          await peticionAPI(
            "/api/trabajadores",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                nombre,
                email,
                password,
                empresaId,
                oficinaId
              })
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          crearMessage.textContent =
            datos.message ||
            "No se ha podido crear el trabajador.";

          return;
        }


        document
          .getElementById(
            "nombre"
          )
          .value =
          "";


        document
          .getElementById(
            "email"
          )
          .value =
          "";


        document
          .getElementById(
            "password"
          )
          .value =
          "";


        crearMessage.textContent =
          "Trabajador creado correctamente.";


        await cargarTrabajadores();

      } catch (error) {

        console.error(
          "Error creando trabajador:",
          error
        );


        crearMessage.textContent =
          "No se ha podido conectar con el servidor.";

      } finally {

        boton.disabled =
          false;


        boton.textContent =
          "Crear trabajador";
      }
    }



    // =====================================================
    // EDITAR TRABAJADOR
    // =====================================================

    async function editarTrabajador(
      trabajador
    ) {

      const nuevoNombre =
        prompt(
          "Nombre:",
          trabajador.usuario?.nombre ||
          trabajador.nombre ||
          ""
        );


      if (
        nuevoNombre === null
      ) {

        return;
      }


      const nuevoEmail =
        prompt(
          "Email:",
          trabajador.usuario?.email ||
          trabajador.email ||
          ""
        );


      if (
        nuevoEmail === null
      ) {

        return;
      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/trabajadores/${trabajador.id}`,
            {
              method: "PATCH",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                nombre:
                  nuevoNombre.trim(),

                email:
                  nuevoEmail.trim()
              })
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          alert(
            datos.message ||
            "No se ha podido modificar el trabajador."
          );

          return;
        }


        await cargarTrabajadores();

      } catch (error) {

        console.error(
          "Error modificando trabajador:",
          error
        );


        alert(
          "No se ha podido conectar con el servidor."
        );
      }
    }



    // =====================================================
    // RECARGAR
    // =====================================================

    document
      .getElementById(
        "recargarTrabajadores"
      )
      .addEventListener(
        "click",
        cargarTrabajadores
      );



    // =====================================================
    // INICIO
    // =====================================================

    cargarEmpresas();

    cargarTrabajadores();

  </script>


</body>

</html>
