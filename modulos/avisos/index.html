<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Avisos - Gestión Interna</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

</head>

<body>

  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

```
<div class="portal-header-left">

  <h1>
    Avisos
  </h1>

  <p id="usuarioCabecera">
    Cargando...
  </p>

</div>


<div class="portal-header-right">

  <button
    id="volver"
    class="btn"
    type="button"
  >

  </button>

```

  <!-- =====================================================
       CONTENIDO
       ===================================================== -->

  <main class="portal-container">

```
<section class="welcome-section">

  <h2 id="bienvenida">
    Gestión de avisos
  </h2>

  <p>
    Crea, publica y archiva avisos para los clientes.
  </p>

</section>



<!-- =====================================================
     CREAR AVISO
     ===================================================== -->

<section class="dashboard-section">

  <h2>
    Crear aviso
  </h2>


  <form id="formAviso">


    <div>

      <label for="titulo">
        Título
      </label>

      <input
        type="text"
        id="titulo"
        required
      >

    </div>


    <div>

      <label for="contenido">
        Contenido
      </label>

      <textarea
        id="contenido"
        rows="5"
        required
      ></textarea>

    </div>


    <div>

      <label for="tipo">
        Tipo
      </label>

      <select id="tipo">

        <option value="GENERAL">
          General
        </option>

        <option value="DOCUMENTACION">
          Documentación
        </option>

        <option value="IMPORTANTE">
          Importante
        </option>

        <option value="PLAZO">
          Plazo
        </option>

        <option value="INFORMACION">
          Información
        </option>

      </select>

    </div>


    <div>

      <label for="prioridad">
        Prioridad
      </label>

      <select id="prioridad">

        <option value="NORMAL">
          Normal
        </option>

        <option value="ALTA">
          Alta
        </option>

        <option value="URGENTE">
          Urgente
        </option>

      </select>

    </div>


    <div>

      <label for="tipoDestinatario">
        Destinatarios
      </label>

      <select id="tipoDestinatario">

        <option value="CLIENTES">
          Clientes concretos
        </option>

        <option value="TODOS">
          Todos los clientes
        </option>

      </select>

    </div>


    <div id="clientesContainer">

      <label for="clienteIds">
        Seleccionar clientes
      </label>

      <select
        id="clienteIds"
        multiple
        size="6"
      ></select>

      <small>
        Puedes seleccionar varios clientes manteniendo pulsada la tecla Ctrl.
      </small>

    </div>


    <div>

      <label for="fechaCaducidad">
        Fecha de caducidad
      </label>

      <input
        type="datetime-local"
        id="fechaCaducidad"
      >

    </div>


    <button
      type="submit"
      class="btn"
    >
      Crear aviso
    </button>


  </form>


  <p id="mensajeFormulario"></p>

</section>



<!-- =====================================================
     LISTADO DE AVISOS
     ===================================================== -->

<section class="dashboard-section">

  <h2>
    Avisos
  </h2>


  <div id="listaAvisos">

    Cargando avisos...

  </div>

</section>
```

  </main>

  <!-- =====================================================
       PIE
       ===================================================== -->

  <footer class="portal-footer">

```
Kit Gestión Asesoría · Gestión Interna
```

  </footer>

  <!-- =====================================================
       JAVASCRIPT COMÚN
       ===================================================== -->

  <script src="../../js/comun.js"></script>

  <!-- =====================================================
       JAVASCRIPT DEL MÓDULO
       ===================================================== -->

  <script>

    // =====================================================
    // COMPROBAR SESIÓN
    // =====================================================

    if (!comprobarSesion()) {

      throw new Error(
        "Sesión no válida"
      );

    }



    // =====================================================
    // USUARIO
    // =====================================================

    const usuario =
      obtenerUsuario();


    document
      .getElementById("usuarioCabecera")
      .textContent =
        `${usuario.nombre} · ${usuario.rol}`;


    document
      .getElementById("bienvenida")
      .textContent =
        `Gestión de avisos · ${usuario.nombre}`;



    // =====================================================
    // VOLVER
    // =====================================================

    document
      .getElementById("volver")
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "../../index.html";

        }
      );



    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById("cerrarSesion")
      .addEventListener(
        "click",
        cerrarSesion
      );



    // =====================================================
    // ELEMENTOS
    // =====================================================

    const formAviso =
      document.getElementById("formAviso");

    const tipoDestinatario =
      document.getElementById("tipoDestinatario");

    const clientesContainer =
      document.getElementById("clientesContainer");

    const clienteIds =
      document.getElementById("clienteIds");

    const listaAvisos =
      document.getElementById("listaAvisos");

    const mensajeFormulario =
      document.getElementById("mensajeFormulario");



    // =====================================================
    // CARGAR CLIENTES
    // =====================================================

    async function cargarClientes() {

      try {

        const respuesta =
          await fetch(
            "/api/clientes",
            {
              headers: {
                "Authorization":
                  `Bearer ${localStorage.getItem("token")}`
              }
            }
          );


        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.message ||
            "No se pudieron cargar los clientes"
          );

        }


        clienteIds.innerHTML = "";


        datos.clientes.forEach(cliente => {

          const opcion =
            document.createElement("option");

          opcion.value =
            cliente.id;

          opcion.textContent =
            `${cliente.nombre} · ${cliente.email}`;

          clienteIds.appendChild(
            opcion
          );

        });

      } catch (error) {

        console.error(
          "Error cargando clientes:",
          error
        );

        clienteIds.innerHTML =
          `<option value="">
             No se pudieron cargar los clientes
           </option>`;

      }

    }



    // =====================================================
    // MOSTRAR / OCULTAR CLIENTES
    // =====================================================

    function actualizarDestinatarios() {

      if (
        tipoDestinatario.value ===
        "TODOS"
      ) {

        clientesContainer.style.display =
          "none";

      } else {

        clientesContainer.style.display =
          "block";

      }

    }


    tipoDestinatario
      .addEventListener(
        "change",
        actualizarDestinatarios
      );


    actualizarDestinatarios();



    // =====================================================
    // CREAR AVISO
    // =====================================================

    formAviso
      .addEventListener(
        "submit",
        async (evento) => {

          evento.preventDefault();


          mensajeFormulario.textContent =
            "Creando aviso...";


          const destinatario =
            tipoDestinatario.value;


          let seleccionados = [];


          if (
            destinatario ===
            "CLIENTES"
          ) {

            seleccionados =
              Array.from(
                clienteIds.selectedOptions
              )
              .map(
                opcion => opcion.value
              );


            if (
              seleccionados.length === 0
            ) {

              mensajeFormulario.textContent =
                "Debes seleccionar al menos un cliente.";

              return;

            }

          }


          const datos = {

            titulo:
              document.getElementById(
                "titulo"
              ).value.trim(),

            contenido:
              document.getElementById(
                "contenido"
              ).value.trim(),

            tipo:
              document.getElementById(
                "tipo"
              ).value,

            prioridad:
              document.getElementById(
                "prioridad"
              ).value,

            tipoDestinatario:
              destinatario,

            fechaCaducidad:
              document.getElementById(
                "fechaCaducidad"
              ).value || null,

            clienteIds:
              seleccionados

          };


          try {

            const respuesta =
              await fetch(
                "/api/avisos",
                {

                  method: "POST",

                  headers: {

                    "Content-Type":
                      "application/json",

                    "Authorization":
                      `Bearer ${localStorage.getItem("token")}`

                  },

                  body:
                    JSON.stringify(
                      datos
                    )

                }
              );


            const resultado =
              await respuesta.json();


            if (!respuesta.ok || !resultado.ok) {

              throw new Error(
                resultado.message ||
                "No se pudo crear el aviso"
              );

            }


            mensajeFormulario.textContent =
              "Aviso creado correctamente.";


            formAviso.reset();


            actualizarDestinatarios();


            cargarAvisos();

          } catch (error) {

            console.error(
              "Error creando aviso:",
              error
            );

            mensajeFormulario.textContent =
              error.message;

          }

        }
      );



    // =====================================================
    // CARGAR AVISOS
    // =====================================================

    async function cargarAvisos() {

      listaAvisos.textContent =
        "Cargando avisos...";


      try {

        const respuesta =
          await fetch(
            "/api/avisos",
            {

              headers: {

                "Authorization":
                  `Bearer ${localStorage.getItem("token")}`

              }

            }
          );


        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.message ||
            "No se pudieron cargar los avisos"
          );

        }


        if (
          !datos.avisos ||
          datos.avisos.length === 0
        ) {

          listaAvisos.textContent =
            "No hay avisos.";

          return;

        }


        listaAvisos.innerHTML = "";


        datos.avisos.forEach(
          aviso => {

            const tarjeta =
              document.createElement(
                "article"
              );


            tarjeta.className =
              "module-card";


            const destinatarios =
              aviso.tipoDestinatario ===
              "TODOS"

                ? "Todos los clientes"

                : `${aviso.destinatarios.length} cliente(s)`;


            tarjeta.innerHTML = `

              <div>

                <h3>
                  ${aviso.titulo}
                </h3>

                <p>
                  ${aviso.contenido}
                </p>

                <p>
                  <strong>Tipo:</strong>
                  ${aviso.tipo}
                </p>

                <p>
                  <strong>Prioridad:</strong>
                  ${aviso.prioridad}
                </p>

                <p>
                  <strong>Estado:</strong>
                  ${aviso.estado}
                </p>

                <p>
                  <strong>Destinatarios:</strong>
                  ${destinatarios}
                </p>

                <p>
                  <strong>Creado por:</strong>
                  ${aviso.creadoPorUsuario
                    ? aviso.creadoPorUsuario.nombre
                    : "-"
                  }
                </p>

              </div>

            `;


            const acciones =
              document.createElement(
                "div"
              );


            acciones.style.marginTop =
              "15px";


            // PUBLICAR

            if (
              aviso.estado ===
              "BORRADOR"
            ) {

              const botonPublicar =
                document.createElement(
                  "button"
                );


              botonPublicar.type =
                "button";

              botonPublicar.className =
                "btn";

              botonPublicar.textContent =
                "Publicar";


              botonPublicar
                .addEventListener(
                  "click",
                  () =>
                    publicarAviso(
                      aviso.id
                    )
                );


              acciones.appendChild(
                botonPublicar
              );

            }


            // ARCHIVAR

            if (
              aviso.estado !==
              "ARCHIVADO"
            ) {

              const botonArchivar =
                document.createElement(
                  "button"
                );


              botonArchivar.type =
                "button";

              botonArchivar.className =
                "btn btn-danger";

              botonArchivar.textContent =
                "Archivar";


              botonArchivar
                .addEventListener(
                  "click",
                  () =>
                    archivarAviso(
                      aviso.id
                    )
                );


              acciones.appendChild(
                botonArchivar
              );

            }


            tarjeta.appendChild(
              acciones
            );


            listaAvisos.appendChild(
              tarjeta
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando avisos:",
          error
        );

        listaAvisos.textContent =
          error.message;

      }

    }



    // =====================================================
    // PUBLICAR AVISO
    // =====================================================

    async function publicarAviso(
      id
    ) {

      if (
        !confirm(
          "¿Quieres publicar este aviso?"
        )
      ) {

        return;

      }


      try {

        const respuesta =
          await fetch(
            `/api/avisos/${id}/publicar`,
            {

              method: "PATCH",

              headers: {

                "Authorization":
                  `Bearer ${localStorage.getItem("token")}`

              }

            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          throw new Error(
            datos.message ||
            "No se pudo publicar el aviso"
          );

        }


        cargarAvisos();

      } catch (error) {

        console.error(
          "Error publicando aviso:",
          error
        );

        alert(
          error.message
        );

      }

    }



    // =====================================================
    // ARCHIVAR AVISO
    // =====================================================

    async function archivarAviso(
      id
    ) {

      if (
        !confirm(
          "¿Quieres archivar este aviso?"
        )
      ) {

        return;

      }


      try {

        const respuesta =
          await fetch(
            `/api/avisos/${id}/archivar`,
            {

              method: "PATCH",

              headers: {

                "Authorization":
                  `Bearer ${localStorage.getItem("token")}`

              }

            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          throw new Error(
            datos.message ||
            "No se pudo archivar el aviso"
          );

        }


        cargarAvisos();

      } catch (error) {

        console.error(
          "Error archivando aviso:",
          error
        );

        alert(
          error.message
        );

      }

    }



    // =====================================================
    // INICIO
    // =====================================================

    cargarClientes();

    cargarAvisos();

  </script>

</body>

</html>
