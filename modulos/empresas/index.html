<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Empresas - Gestión Interna</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

  <style>

    /* =====================================================
       EMPRESAS - ESTILOS VISUALES
       ===================================================== */

    .page-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }


    /* =====================================================
       FORMULARIO
       ===================================================== */

    .form-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 35px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    .form-card h3 {
      margin: 0 0 20px;
      color: #111827;
      font-size: 20px;
    }

    .empresa-form {
      display: flex;
      align-items: flex-end;
      gap: 15px;
    }

    .empresa-form-field {
      flex: 1;
    }

    .empresa-form-field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .empresa-form-field input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #1f2937;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .empresa-form-field input:focus {
      border-color: #2563eb;
      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    /* =====================================================
       LISTADO
       ===================================================== */

    .empresas-list {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 20px;
    }


    /* =====================================================
       TARJETA EMPRESA
       ===================================================== */

    .empresa-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 22px;
      box-shadow:
        0 4px 12px rgba(15, 23, 42, 0.04);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .empresa-card:hover {
      transform: translateY(-2px);
      border-color: #cbd5e1;
      box-shadow:
        0 8px 24px rgba(15, 23, 42, 0.08);
    }


    .empresa-card h3 {
      margin: 0 0 15px;
      font-size: 19px;
      color: #111827;
    }


    .empresa-info {
      margin: 0 0 7px;
      color: #6b7280;
      font-size: 14px;
    }


    .empresa-id {
      margin: 0 0 20px;
      color: #9ca3af;
      font-size: 12px;
      word-break: break-all;
    }


    /* =====================================================
       ESTADO
       ===================================================== */

    .empresa-estado {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .empresa-estado.activa {
      background: #ecfdf5;
      color: #047857;
    }

    .empresa-estado.inactiva {
      background: #f3f4f6;
      color: #6b7280;
    }


    /* =====================================================
       ACCIONES TARJETA
       ===================================================== */

    .empresa-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .empresa-actions .btn {
      flex: 1;
      min-width: 100px;
    }


    /* =====================================================
       MENSAJE VACÍO
       ===================================================== */

    .empty-state {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 35px;
      text-align: center;
      color: #6b7280;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 1000px) {

      .empresas-list {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    @media (max-width: 700px) {

      .empresa-form {
        flex-direction: column;
        align-items: stretch;
      }

      .empresa-form .btn {
        width: 100%;
      }

      .empresas-list {
        grid-template-columns: 1fr;
      }

      .page-actions {
        justify-content: stretch;
      }

      .page-actions .btn {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

    <div class="portal-header-left">

      <h1>
        Gestión Interna
      </h1>

      <p id="usuarioCabecera">
        Cargando...
      </p>

    </div>


    <div class="portal-header-right">

      <a
        href="../../index.html"
        class="btn btn-secondary"
      >
        ← Volver al panel
      </a>

      <button
        id="cerrarSesion"
        class="btn btn-danger"
        type="button"
      >
        Cerrar sesión
      </button>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <main class="portal-container">


    <!-- ===================================================
         TÍTULO
         =================================================== -->

    <section class="welcome-section">

      <h2>
        Empresas
      </h2>

      <p>
        Gestiona las empresas registradas en el sistema.
      </p>

    </section>



    <!-- ===================================================
         ACCIONES
         =================================================== -->

    <section class="dashboard-section">

      <div class="page-actions">

        <button
          id="recargarEmpresas"
          class="btn btn-secondary"
          type="button"
        >
          ↻ Recargar empresas
        </button>

      </div>


      <p
        id="listadoMessage"
        class="message"
      ></p>



      <!-- =================================================
           FORMULARIO NUEVA EMPRESA
           ================================================= -->

      <div
        id="formularioEmpresa"
        class="form-card"
      >

        <h3>
          Nueva empresa
        </h3>


        <form
          id="crearEmpresaForm"
          class="empresa-form"
        >

          <div class="empresa-form-field">

            <label for="nombreEmpresa">
              Nombre de la empresa
            </label>

            <input
              id="nombreEmpresa"
              type="text"
              required
            >

          </div>


          <button
            class="btn btn-primary"
            type="submit"
          >
            + Crear empresa
          </button>

        </form>

      </div>


    </section>



    <!-- ===================================================
         LISTADO DE EMPRESAS
         =================================================== -->

    <section class="dashboard-section">

      <h2>
        Empresas registradas
      </h2>


      <div
        id="empresasContainer"
        class="empresas-list"
      >

        Cargando empresas...

      </div>

    </section>


  </main>



  <!-- =====================================================
       PIE
       ===================================================== -->

  <footer class="portal-footer">

    Gestión Interna · Kit Gestión Asesoría

  </footer>



  <!-- =====================================================
       JAVASCRIPT COMÚN
       ===================================================== -->

  <script src="../../js/comun.js"></script>



  <!-- =====================================================
       JAVASCRIPT DE EMPRESAS
       ===================================================== -->

  <script>


    // =====================================================
    // COMPROBAR SESIÓN
    // =====================================================

    if (!comprobarSesion()) {

      throw new Error(
        "Sesión no válida"
      );

    }


    const usuario =
      obtenerUsuario();


    // =====================================================
    // MOSTRAR USUARIO
    // =====================================================

    document
      .getElementById(
        "usuarioCabecera"
      )
      .textContent =
        usuario.nombre;



    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById(
        "cerrarSesion"
      )
      .addEventListener(
        "click",
        cerrarSesion
      );



    // =====================================================
    // CARGAR EMPRESAS
    // =====================================================

    async function cargarEmpresas() {

      const container =
        document.getElementById(
          "empresasContainer"
        );


      const message =
        document.getElementById(
          "listadoMessage"
        );


      container.innerHTML =
        "Cargando empresas...";

      message.textContent =
        "";


      try {

        const respuesta =
          await peticionAPI(
            "/api/empresas"
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          container.innerHTML =
            "";

          message.textContent =
            datos.message ||
            "No se han podido cargar las empresas.";

          return;
        }


        if (
          !Array.isArray(
            datos.empresas
          ) ||
          datos.empresas.length === 0
        ) {

          container.innerHTML = `
            <div class="empty-state">
              No hay empresas registradas.
            </div>
          `;

          return;
        }


        container.innerHTML =
          "";


        datos.empresas.forEach(
          (empresa) => {

            const article =
              document.createElement(
                "article"
              );


            article.className =
              "empresa-card";


            // =================================================
            // NOMBRE
            // =================================================

            const titulo =
              document.createElement(
                "h3"
              );


            titulo.textContent =
              empresa.nombre ||
              "Sin nombre";


            // =================================================
            // ESTADO
            // =================================================

            const estado =
              document.createElement(
                "p"
              );


            estado.textContent =
              empresa.activo
                ? "Activa"
                : "Inactiva";


            estado.className =
              empresa.activo
                ? "empresa-estado activa"
                : "empresa-estado inactiva";


            // =================================================
            // ID
            // =================================================

            const identificador =
              document.createElement(
                "p"
              );


            identificador.textContent =
              `ID: ${empresa.id}`;


            identificador.className =
              "empresa-id";


            // =================================================
            // BOTÓN EDITAR
            // =================================================

            const editar =
              document.createElement(
                "button"
              );


            editar.type =
              "button";

            editar.textContent =
              "Editar";


            editar.className =
              "btn btn-secondary";


            editar.addEventListener(
              "click",
              () =>
                editarEmpresa(
                  empresa
                )
            );


            // =================================================
            // BOTÓN DESACTIVAR
            // =================================================

            const desactivar =
              document.createElement(
                "button"
              );


            desactivar.type =
              "button";


            desactivar.textContent =
              "Desactivar";


            desactivar.className =
              "btn btn-danger";


            desactivar.disabled =
              !empresa.activo;


            desactivar.addEventListener(
              "click",
              () =>
                desactivarEmpresa(
                  empresa.id
                )
            );


            // =================================================
            // CONTENEDOR ACCIONES
            // =================================================

            const acciones =
              document.createElement(
                "div"
              );


            acciones.className =
              "empresa-actions";


            acciones.appendChild(
              editar
            );


            acciones.appendChild(
              desactivar
            );


            // =================================================
            // CONSTRUIR EMPRESA
            // =================================================

            article.appendChild(
              titulo
            );


            article.appendChild(
              estado
            );


            article.appendChild(
              identificador
            );


            article.appendChild(
              acciones
            );


            container.appendChild(
              article
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando empresas:",
          error
        );


        container.innerHTML =
          "";


        message.textContent =
          "No se ha podido conectar con el servidor.";

      }

    }



    // =====================================================
    // CREAR EMPRESA
    // =====================================================

    document
      .getElementById(
        "crearEmpresaForm"
      )
      .addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const nombre =
            document
              .getElementById(
                "nombreEmpresa"
              )
              .value
              .trim();


          if (!nombre) {

            alert(
              "El nombre de la empresa es obligatorio."
            );

            return;
          }


          try {

            const respuesta =
              await peticionAPI(
                "/api/empresas",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify({
                      nombre
                    })
                }
              );


            const datos =
              await respuesta.json();


            if (
              !respuesta.ok ||
              !datos.ok
            ) {

              alert(
                datos.message ||
                "No se ha podido crear la empresa."
              );

              return;
            }


            document
              .getElementById(
                "nombreEmpresa"
              )
              .value =
                "";


            await cargarEmpresas();


          } catch (error) {

            console.error(
              "Error creando empresa:",
              error
            );


            alert(
              "No se ha podido conectar con el servidor."
            );

          }

        }
      );



    // =====================================================
    // EDITAR EMPRESA
    // =====================================================

    async function editarEmpresa(
      empresa
    ) {

      const nuevoNombre =
        prompt(
          "Nuevo nombre de la empresa:",
          empresa.nombre
        );


      if (
        nuevoNombre === null
      ) {

        return;
      }


      const nombre =
        nuevoNombre.trim();


      if (!nombre) {

        alert(
          "El nombre de la empresa es obligatorio."
        );

        return;
      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/empresas/${empresa.id}`,
            {
              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  nombre
                })
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          alert(
            datos.message ||
            "No se ha podido modificar la empresa."
          );

          return;
        }


        await cargarEmpresas();


      } catch (error) {

        console.error(
          "Error modificando empresa:",
          error
        );


        alert(
          "No se ha podido conectar con el servidor."
        );

      }

    }



    // =====================================================
    // DESACTIVAR EMPRESA
    // =====================================================

    async function desactivarEmpresa(
      empresaId
    ) {

      const confirmar =
        confirm(
          "¿Seguro que quieres desactivar esta empresa?"
        );


      if (!confirmar) {

        return;
      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/empresas/${empresaId}/desactivar`,
            {
              method: "PATCH"
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          alert(
            datos.message ||
            "No se ha podido desactivar la empresa."
          );

          return;
        }


        await cargarEmpresas();


      } catch (error) {

        console.error(
          "Error desactivando empresa:",
          error
        );


        alert(
          "No se ha podido conectar con el servidor."
        );

      }

    }



    // =====================================================
    // RECARGAR
    // =====================================================

    document
      .getElementById(
        "recargarEmpresas"
      )
      .addEventListener(
        "click",
        cargarEmpresas
      );



    // =====================================================
    // INICIO
    // =====================================================

    cargarEmpresas();


  </script>


</body>

</html>
