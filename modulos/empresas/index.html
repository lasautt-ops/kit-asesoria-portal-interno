<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Empresas - Gestión Interna</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >


  <style>

    /* =====================================================
       EMPRESAS - ESTILOS VISUALES
       ===================================================== */

    .page-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }


    /* =====================================================
       FORMULARIO NUEVA EMPRESA
       ===================================================== */

    .form-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 35px;

      box-shadow:
        0 4px 12px rgba(15, 23, 42, 0.04);
    }


    .form-card h3 {
      margin: 0 0 20px;

      font-size: 20px;

      color: #111827;
    }


    .empresa-form {
  display: flex;
  align-items: flex-end;
  gap: 15px;
}


/* =====================================================
   FORMULARIO EMPRESA COMPLETO
   ===================================================== */

.empresa-form-completo {
  display: block;
}


.empresa-form-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 18px;

  margin-bottom: 22px;
}


.empresa-form-section-title {
  margin: 28px 0 18px;

  padding-bottom: 8px;

  border-bottom: 1px solid #e5e7eb;

  font-size: 15px;
  font-weight: 700;

  color: #374151;
}


.empresa-form-field textarea {
  width: 100%;

  padding: 11px 12px;

  border: 1px solid #d1d5db;
  border-radius: 8px;

  font-size: 15px;

  font-family: inherit;

  outline: none;

  background: #ffffff;
  color: #1f2937;

  resize: vertical;

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}


.empresa-form-field textarea:focus {
  border-color: #2563eb;

  box-shadow:
    0 0 0 3px rgba(37, 99, 235, 0.10);
}


.empresa-form-notas {
  margin-bottom: 20px;
}


.empresa-form-actions {
  display: flex;

  justify-content: flex-end;
}


@media (max-width: 700px) {

  .empresa-form-grid {
    grid-template-columns: 1fr;
  }

}


.empresa-form-field {
  flex: 1;
}

    .empresa-form-field label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 600;

      color: #374151;
    }


    .empresa-form-field input {
      width: 100%;

      padding: 11px 12px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      font-size: 15px;

      outline: none;

      background: #ffffff;
      color: #1f2937;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }


    .empresa-form-field input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    /* =====================================================
       LISTADO DE EMPRESAS
       ===================================================== */

    .empresas-list {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 20px;

      width: 100%;
    }


    /* =====================================================
       TARJETA EMPRESA
       ===================================================== */

    .empresa-card {
      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      padding: 22px;

      box-shadow:
        0 4px 12px rgba(15, 23, 42, 0.04);

      min-width: 0;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }


    .empresa-card:hover {
      transform: translateY(-2px);

      border-color: #cbd5e1;

      box-shadow:
        0 8px 24px rgba(15, 23, 42, 0.08);
    }


    .empresa-card h3 {
      margin: 0 0 15px;

      font-size: 19px;

      color: #111827;

      word-break: break-word;
    }


    /* =====================================================
       INFORMACIÓN EMPRESA
       ===================================================== */

    .empresa-info {
      margin: 0 0 7px;

      color: #6b7280;

      font-size: 14px;
    }


    .empresa-id {
      margin: 0 0 18px;

      color: #9ca3af;

      font-size: 12px;

      word-break: break-all;
    }


    /* =====================================================
       ESTADO EMPRESA
       ===================================================== */

    .empresa-estado {
      display: inline-flex;

      align-items: center;

      padding: 5px 10px;

      border-radius: 999px;

      font-size: 12px;
      font-weight: 600;

      margin-bottom: 18px;
    }


    .empresa-estado.activa {
      background: #ecfdf5;

      color: #047857;
    }


    .empresa-estado.inactiva {
      background: #f3f4f6;

      color: #6b7280;
    }


    /* =====================================================
       ACCIONES DE EMPRESA
       ===================================================== */

    .empresa-actions {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;

      padding-top: 5px;
    }


    .empresa-actions .btn {
      flex: 1;

      min-width: 100px;
    }


    /* =====================================================
       BOTONES
       ===================================================== */

    .empresa-actions .btn-secondary {
      background: #f3f4f6;

      color: #374151;
    }


    .empresa-actions .btn-secondary:hover {
      background: #e5e7eb;
    }


    .empresa-actions .btn-danger {
      background: #dc2626;

      color: #ffffff;
    }


    .empresa-actions .btn-danger:hover {
      background: #b91c1c;
    }


    .empresa-actions .btn-danger:disabled {
      background: #f3f4f6;

      color: #9ca3af;

      cursor: not-allowed;

      transform: none;
    }


    /* =====================================================
       ESTADO VACÍO
       ===================================================== */

    .empty-state {
      grid-column: 1 / -1;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 12px;

      padding: 35px;

      text-align: center;

      color: #6b7280;
    }


    /* =====================================================
       MENSAJES
       ===================================================== */

    #listadoMessage {
      margin-bottom: 20px;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 1000px) {

      .empresas-list {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    @media (max-width: 700px) {

      .empresa-form {
        flex-direction: column;

        align-items: stretch;
      }


      .empresa-form .btn {
        width: 100%;
      }


      .empresas-list {
        grid-template-columns: 1fr;
      }


      .page-actions {
        justify-content: stretch;
      }


      .page-actions .btn {
        width: 100%;
      }

    }


    @media (max-width: 600px) {

      .empresa-card {
        padding: 20px;
      }


      .empresa-actions {
        flex-direction: column;
      }


      .empresa-actions .btn {
        width: 100%;
      }

    }

  </style>

</head>

  <!-- =====================================================
       JAVASCRIPT DE EMPRESAS
       ===================================================== -->

  <script>


    // =====================================================
    // COMPROBAR SESIÓN
    // =====================================================

    if (!comprobarSesion()) {

      throw new Error(
        "Sesión no válida"
      );

    }


    const usuario =
      obtenerUsuario();


    // =====================================================
    // MOSTRAR USUARIO
    // =====================================================

    document
      .getElementById(
        "usuarioCabecera"
      )
      .textContent =
        usuario.nombre;



    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById(
        "cerrarSesion"
      )
      .addEventListener(
        "click",
        cerrarSesion
      );



    // =====================================================
    // CARGAR EMPRESAS
    // =====================================================

    async function cargarEmpresas() {

      const container =
        document.getElementById(
          "empresasContainer"
        );


      const message =
        document.getElementById(
          "listadoMessage"
        );


      container.innerHTML =
        "Cargando empresas...";

      message.textContent =
        "";


      try {

        const respuesta =
          await peticionAPI(
            "/api/empresas"
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          container.innerHTML =
            "";

          message.textContent =
            datos.message ||
            "No se han podido cargar las empresas.";

          return;
        }


        if (
          !Array.isArray(
            datos.empresas
          ) ||
          datos.empresas.length === 0
        ) {

          container.innerHTML = `
            <div class="empty-state">
              No hay empresas registradas.
            </div>
          `;

          return;
        }


        container.innerHTML =
          "";


        datos.empresas.forEach(
          (empresa) => {

            const article =
              document.createElement(
                "article"
              );


            article.className =
              "empresa-card";


            // =================================================
            // NOMBRE
            // =================================================

            const titulo =
              document.createElement(
                "h3"
              );


            titulo.textContent =
              empresa.nombre ||
              "Sin nombre";


            // =================================================
            // ESTADO
            // =================================================

            const estado =
              document.createElement(
                "p"
              );


            estado.textContent =
              empresa.activo
                ? "Activa"
                : "Inactiva";


            estado.className =
              empresa.activo
                ? "empresa-estado activa"
                : "empresa-estado inactiva";


            // =================================================
            // ID
            // =================================================

            const identificador =
              document.createElement(
                "p"
              );


            identificador.textContent =
              `ID: ${empresa.id}`;


            identificador.className =
              "empresa-id";


            // =================================================
            // BOTÓN EDITAR
            // =================================================

            const editar =
              document.createElement(
                "button"
              );


            editar.type =
              "button";

            editar.textContent =
              "Editar";


            editar.className =
              "btn btn-secondary";


            editar.addEventListener(
              "click",
              () =>
                editarEmpresa(
                  empresa
                )
            );


            // =================================================
            // BOTÓN DESACTIVAR
            // =================================================

            const desactivar =
              document.createElement(
                "button"
              );


            desactivar.type =
              "button";


            desactivar.textContent =
              "Desactivar";


            desactivar.className =
              "btn btn-danger";


            desactivar.disabled =
              !empresa.activo;


            desactivar.addEventListener(
              "click",
              () =>
                desactivarEmpresa(
                  empresa.id
                )
            );


            // =================================================
            // CONTENEDOR ACCIONES
            // =================================================

            const acciones =
              document.createElement(
                "div"
              );


            acciones.className =
              "empresa-actions";


            acciones.appendChild(
              editar
            );


            acciones.appendChild(
              desactivar
            );


            // =================================================
            // CONSTRUIR EMPRESA
            // =================================================

            article.appendChild(
              titulo
            );


            article.appendChild(
              estado
            );


            article.appendChild(
              identificador
            );


            article.appendChild(
              acciones
            );


            container.appendChild(
              article
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando empresas:",
          error
        );


        container.innerHTML =
          "";


        message.textContent =
          "No se ha podido conectar con el servidor.";

      }

    }



    // =====================================================
// CREAR EMPRESA
// =====================================================

document
  .getElementById(
    "crearEmpresaForm"
  )
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const nombre =
        document
          .getElementById(
            "nombreEmpresa"
          )
          .value
          .trim();


      const cif =
        document
          .getElementById(
            "cifEmpresa"
          )
          .value
          .trim();


      const direccion =
        document
          .getElementById(
            "direccionEmpresa"
          )
          .value
          .trim();


      const codigoPostal =
        document
          .getElementById(
            "codigoPostalEmpresa"
          )
          .value
          .trim();


      const poblacion =
        document
          .getElementById(
            "poblacionEmpresa"
          )
          .value
          .trim();


      const provincia =
        document
          .getElementById(
            "provinciaEmpresa"
          )
          .value
          .trim();


      const nombreAdministrador =
        document
          .getElementById(
            "nombreAdministradorEmpresa"
          )
          .value
          .trim();


      const emailAdministrador =
        document
          .getElementById(
            "emailAdministradorEmpresa"
          )
          .value
          .trim();


      const telefonoAdministrador =
        document
          .getElementById(
            "telefonoAdministradorEmpresa"
          )
          .value
          .trim();


      const web =
        document
          .getElementById(
            "webEmpresa"
          )
          .value
          .trim();


      const notas =
        document
          .getElementById(
            "notasEmpresa"
          )
          .value
          .trim();


      if (!nombre) {

        alert(
          "El nombre de la empresa es obligatorio."
        );

        return;
      }


      if (!cif) {

        alert(
          "El CIF de la empresa es obligatorio."
        );

        return;
      }


      try {

        const respuesta =
          await peticionAPI(
            "/api/empresas",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  nombre,
                  cif,
                  direccion,
                  codigoPostal,
                  poblacion,
                  provincia,
                  nombreAdministrador,
                  emailAdministrador,
                  telefonoAdministrador,
                  web,
                  notas
                })
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          alert(
            datos.message ||
            "No se ha podido crear la empresa."
          );

          return;
        }


        document
          .getElementById(
            "crearEmpresaForm"
          )
          .reset();


        await cargarEmpresas();


      } catch (error) {

        console.error(
          "Error creando empresa:",
          error
        );


        alert(
          "No se ha podido conectar con el servidor."
        );

      }

    }
  );



      // =====================================================
    // EDITAR EMPRESA
    // =====================================================

    function editarEmpresa(
      empresa
    ) {

      // ===================================================
      // MOSTRAR FORMULARIO
      // ===================================================

      const formulario =
        document.getElementById(
          "formularioEditarEmpresa"
        );


      formulario.style.display =
        "block";


      // ===================================================
      // RELLENAR DATOS
      // ===================================================

      document
        .getElementById(
          "editarEmpresaId"
        )
        .value =
          empresa.id;


      document
        .getElementById(
          "editarNombreEmpresa"
        )
        .value =
          empresa.nombre || "";


      document
        .getElementById(
          "editarCifEmpresa"
        )
        .value =
          empresa.cif || "";


      document
        .getElementById(
          "editarDireccionEmpresa"
        )
        .value =
          empresa.direccion || "";


      document
        .getElementById(
          "editarCodigoPostalEmpresa"
        )
        .value =
          empresa.codigoPostal || "";


      document
        .getElementById(
          "editarPoblacionEmpresa"
        )
        .value =
          empresa.poblacion || "";


      document
        .getElementById(
          "editarProvinciaEmpresa"
        )
        .value =
          empresa.provincia || "";


      document
        .getElementById(
          "editarNombreAdministradorEmpresa"
        )
        .value =
          empresa.nombreAdministrador || "";


      document
        .getElementById(
          "editarEmailAdministradorEmpresa"
        )
        .value =
          empresa.emailAdministrador || "";


      document
        .getElementById(
          "editarTelefonoAdministradorEmpresa"
        )
        .value =
          empresa.telefonoAdministrador || "";


      document
        .getElementById(
          "editarWebEmpresa"
        )
        .value =
          empresa.web || "";


      document
        .getElementById(
          "editarNotasEmpresa"
        )
        .value =
          empresa.notas || "";


      // ===================================================
      // SUBIR HASTA EL FORMULARIO
      // ===================================================

      formulario.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }



    // =====================================================
    // GUARDAR CAMBIOS EMPRESA
    // =====================================================

    document
      .getElementById(
        "editarEmpresaForm"
      )
      .addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          // =================================================
          // OBTENER DATOS
          // =================================================

          const empresaId =
            document
              .getElementById(
                "editarEmpresaId"
              )
              .value;


          const nombre =
            document
              .getElementById(
                "editarNombreEmpresa"
              )
              .value
              .trim();


          const cif =
            document
              .getElementById(
                "editarCifEmpresa"
              )
              .value
              .trim();


          const direccion =
            document
              .getElementById(
                "editarDireccionEmpresa"
              )
              .value
              .trim();


          const codigoPostal =
            document
              .getElementById(
                "editarCodigoPostalEmpresa"
              )
              .value
              .trim();


          const poblacion =
            document
              .getElementById(
                "editarPoblacionEmpresa"
              )
              .value
              .trim();


          const provincia =
            document
              .getElementById(
                "editarProvinciaEmpresa"
              )
              .value
              .trim();


          const nombreAdministrador =
            document
              .getElementById(
                "editarNombreAdministradorEmpresa"
              )
              .value
              .trim();


          const emailAdministrador =
            document
              .getElementById(
                "editarEmailAdministradorEmpresa"
              )
              .value
              .trim();


          const telefonoAdministrador =
            document
              .getElementById(
                "editarTelefonoAdministradorEmpresa"
              )
              .value
              .trim();


          const web =
            document
              .getElementById(
                "editarWebEmpresa"
              )
              .value
              .trim();


          const notas =
            document
              .getElementById(
                "editarNotasEmpresa"
              )
              .value
              .trim();


          // =================================================
          // VALIDACIONES
          // =================================================

          if (!nombre) {

            alert(
              "La razón social / nombre es obligatorio."
            );

            return;
          }


          if (!cif) {

            alert(
              "El CIF de la empresa es obligatorio."
            );

            return;
          }


          if (!empresaId) {

            alert(
              "No se ha podido identificar la empresa."
            );

            return;
          }


          // =================================================
          // ACTUALIZAR EMPRESA
          // =================================================

          try {

            const respuesta =
              await peticionAPI(
                `/api/empresas/${empresaId}`,
                {
                  method: "PUT",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify({
                      nombre,
                      cif,
                      direccion,
                      codigoPostal,
                      poblacion,
                      provincia,
                      nombreAdministrador,
                      emailAdministrador,
                      telefonoAdministrador,
                      web,
                      notas
                    })
                }
              );


            const datos =
              await respuesta.json();


            if (
              !respuesta.ok ||
              !datos.ok
            ) {

              alert(
                datos.message ||
                "No se ha podido modificar la empresa."
              );

              return;
            }


            // ===============================================
            // OCULTAR FORMULARIO
            // ===============================================

            document
              .getElementById(
                "formularioEditarEmpresa"
              )
              .style.display =
                "none";


            // ===============================================
            // RECARGAR LISTADO
            // ===============================================

            await cargarEmpresas();


          } catch (error) {

            console.error(
              "Error modificando empresa:",
              error
            );


            alert(
              "No se ha podido conectar con el servidor."
            );

          }

        }
      );



    // =====================================================
    // CANCELAR EDICIÓN
    // =====================================================

    document
      .getElementById(
        "cancelarEdicionEmpresa"
      )
      .addEventListener(
        "click",
        () => {

          document
            .getElementById(
              "formularioEditarEmpresa"
            )
            .style.display =
              "none";

        }
      );



    // =====================================================
    // DESACTIVAR EMPRESA
    // =====================================================

    async function desactivarEmpresa(
      empresaId
    ) {

      const confirmar =
        confirm(
          "¿Seguro que quieres desactivar esta empresa?"
        );


      if (!confirmar) {

        return;
      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/empresas/${empresaId}/desactivar`,
            {
              method: "PATCH"
            }
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          alert(
            datos.message ||
            "No se ha podido desactivar la empresa."
          );

          return;
        }


        await cargarEmpresas();


      } catch (error) {

        console.error(
          "Error desactivando empresa:",
          error
        );


        alert(
          "No se ha podido conectar con el servidor."
        );

      }

    }



    // =====================================================
    // RECARGAR
    // =====================================================

    document
      .getElementById(
        "recargarEmpresas"
      )
      .addEventListener(
        "click",
        cargarEmpresas
      );



    // =====================================================
    // INICIO
    // =====================================================

    cargarEmpresas();


  </script>
