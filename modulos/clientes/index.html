
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Clientes - Gestión Interna</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

<style>

/* =====================================================
   CLIENTES - ESTILOS VISUALES
   ===================================================== */

.page-actions {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 20px;
}


/* =====================================================
   FORMULARIOS
   ===================================================== */

.form-card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 35px;

  box-shadow:
    0 4px 12px rgba(15, 23, 42, 0.04);
}


.form-card h3 {
  margin: 0 0 20px;

  font-size: 20px;

  color: #111827;
}


.cliente-form-completo {
  display: block;
}


.cliente-form-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 18px;

  margin-bottom: 22px;
}


.cliente-form-section-title {
  margin: 28px 0 18px;

  padding-bottom: 8px;

  border-bottom: 1px solid #e5e7eb;

  font-size: 15px;
  font-weight: 700;

  color: #374151;
}


.cliente-form-field label {
  display: block;

  margin-bottom: 7px;

  font-size: 14px;
  font-weight: 600;

  color: #374151;
}


.cliente-form-field input,
.cliente-form-field select {
  width: 100%;

  padding: 11px 12px;

  border: 1px solid #d1d5db;
  border-radius: 8px;

  font-size: 15px;

  outline: none;

  background: #ffffff;
  color: #1f2937;

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}


.cliente-form-field input:focus,
.cliente-form-field select:focus {
  border-color: #2563eb;

  box-shadow:
    0 0 0 3px rgba(37, 99, 235, 0.10);
}


.cliente-form-actions {
  display: flex;

  justify-content: flex-end;

  gap: 10px;
}


/* =====================================================
   LISTADO DE CLIENTES
   ===================================================== */

#clientesContainer {
  width: 100%;
}


.clientes-list {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 20px;

  width: 100%;
}



/* =====================================================
   TARJETA CLIENTE
   ===================================================== */

.cliente-card {
  display: flex;

  flex-direction: column;

  background: #ffffff;

  border: 1px solid #e5e7eb;
  border-radius: 12px;

  padding: 22px;

  box-shadow:
    0 4px 12px rgba(15, 23, 42, 0.04);

  min-width: 0;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    border-color 0.15s ease;
}


.cliente-card:hover {
  transform: translateY(-2px);

  border-color: #cbd5e1;

  box-shadow:
    0 8px 24px rgba(15, 23, 42, 0.08);
}



/* =====================================================
   NOMBRE DEL CLIENTE
   ===================================================== */

.cliente-card h3 {
  margin: 0 0 18px;

  padding-bottom: 15px;

  border-bottom: 1px solid #e5e7eb;

  font-size: 19px;
  font-weight: 700;

  line-height: 1.35;

  color: #111827;

  word-break: break-word;
}



/* =====================================================
   INFORMACIÓN CLIENTE
   ===================================================== */

.cliente-info {
  margin: 0 0 8px;

  color: #4b5563;

  font-size: 14px;

  line-height: 1.5;

  word-break: break-word;
}


.cliente-info:last-of-type {
  margin-bottom: 0;
}



/* =====================================================
   BLOQUE ASIGNACIÓN
   ===================================================== */

.cliente-asignacion {
  margin: 18px 0;

  padding: 13px 14px;

  background: #f8fafc;

  border: 1px solid #e5e7eb;

  border-radius: 8px;
}


.cliente-asignacion p {
  margin: 0;

  color: #475569;

  font-size: 13px;

  line-height: 1.5;

  word-break: break-word;
}


.cliente-asignacion p + p {
  margin-top: 5px;
}



/* =====================================================
   FECHA DE CREACIÓN
   ===================================================== */

.cliente-id {
  margin: 8px 0 20px;

  color: #9ca3af;

  font-size: 12px;

  line-height: 1.4;

  word-break: break-word;
}



/* =====================================================
   ACCIONES CLIENTE
   ===================================================== */

.cliente-actions {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;

  margin-top: auto;

  padding-top: 5px;
}


.cliente-actions .btn {
  flex: 1;

  min-width: 120px;

  white-space: nowrap;
}



/* =====================================================
   BOTONES CLIENTE
   ===================================================== */

.cliente-actions .btn-secondary {
  background: #f3f4f6;

  color: #374151;
}


.cliente-actions .btn-secondary:hover {
  background: #e5e7eb;
}



/* =====================================================
   ESTADO VACÍO
   ===================================================== */

.empty-state {
  grid-column: 1 / -1;

  background: #ffffff;

  border: 1px solid #e5e7eb;

  border-radius: 12px;

  padding: 35px;

  text-align: center;

  color: #6b7280;
}


#clientesContainer > p {
  margin: 0;

  padding: 35px;

  background: #ffffff;

  border: 1px solid #e5e7eb;

  border-radius: 12px;

  text-align: center;

  color: #6b7280;
}



/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 1000px) {

  .clientes-list {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

}


@media (max-width: 700px) {

  .clientes-list {
    grid-template-columns: 1fr;
  }


  .cliente-actions {
    flex-direction: column;
  }


  .cliente-actions .btn {
    width: 100%;
  }

}


@media (max-width: 600px) {

  .cliente-card {
    padding: 20px;
  }

}

/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 1000px) {

  .clientes-list {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

}


@media (max-width: 700px) {

  .cliente-form-grid {
    grid-template-columns: 1fr;
  }


  .clientes-list {
    grid-template-columns: 1fr;
  }


  .page-actions {
    justify-content: stretch;
  }


  .page-actions .btn {
    width: 100%;
  }


  .cliente-form-actions {
    flex-direction: column;
  }


  .cliente-form-actions .btn {
    width: 100%;
  }

}


@media (max-width: 600px) {

  .cliente-card {
    padding: 20px;
  }


  .cliente-actions {
    flex-direction: column;
  }


  .cliente-actions .btn {
    width: 100%;
  }

}

</style>


</head>

    <!-- ===================================================
     CREAR CLIENTE
     =================================================== -->

<section class="dashboard-section">

  <div class="form-card">

    <h3>
      Crear nuevo cliente
    </h3>


    <div class="cliente-form-completo">

      <!-- DATOS DEL CLIENTE -->

      <div class="cliente-form-section-title">

        <div class="cliente-form-field">

          <label for="administrador">

        <div class="cliente-form-field">

      <!-- ASIGNACIÓN -->

      <div class="cliente-form-section-title">
        Asignación
      </div>


      <div class="cliente-form-grid">

        <div class="cliente-form-field">

          <label for="empresaSelect">
            Empresa:
          </label>

          <select id="empresaSelect">

            <option value="">

            </option>

          </select>

        </div>


        <div class="cliente-form-field">

          <label for="oficinaSelect">
            Oficina:
          </label>

          <select id="oficinaSelect">

</section>



    <!-- ===================================================
         EDITAR CLIENTE
         =================================================== -->

    <section

        </label>

      <!-- DNI ADMINISTRADOR -->

      <div>

        <label for="editarDniAdministrador">

        </label>

      </div>


      <!-- EMPRESA -->

      <div>

        <label for="editarEmpresaSelect">
          Empresa:
        </label>

        <select id="editarEmpresaSelect">

          <option value="">

          </option>

        </select>

      </div>


      <!-- OFICINA -->

      <div>

        <label for="editarOficinaSelect">

      <button

    <section class="dashboard-section">

      <div

  <!-- =====================================================
       JAVASCRIPT DEL MÓDULO
       ===================================================== -->

  <script>

    // =====================================================
    // SESIÓN
    // =====================================================

    if (!comprobarSesion()) {

      throw new Error(
        "Sesión no válida"
      );

    }


    const usuario =
      obtenerUsuario();


    document
      .getElementById(
        "usuarioCabecera"
      )
      .textContent =
        `${usuario.nombre} · ${usuario.rol}`;



    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById(
        "cerrarSesion"
      )
      .addEventListener(
        "click",
        cerrarSesion
      );



    // =====================================================
    // ELEMENTOS CREAR
    // =====================================================

    const empresaSelect =
      document.getElementById(
        "empresaSelect"
      );


    const oficinaSelect =
      document.getElementById(
        "oficinaSelect"
      );


    const crearMessage =
      document.getElementById(
        "crearMessage"
      );



    // =====================================================
    // ELEMENTOS EDITAR
    // =====================================================

    const editarClienteSection =
      document.getElementById(
        "editarClienteSection"
      );


    const editarClienteId =
      document.getElementById(
        "editarClienteId"
      );


    const editarEmpresaSelect =
      document.getElementById(
        "editarEmpresaSelect"
      );


    const editarOficinaSelect =
      document.getElementById(
        "editarOficinaSelect"
      );


    const editarMessage =
      document.getElementById(
        "editarMessage"
      );


    const clientesContainer =
      document.getElementById(
        "clientesContainer"
      );


    const listadoMessage =
      document.getElementById(
        "listadoMessage"
      );



    // =====================================================
    // CARGAR EMPRESAS PARA CREAR
    // =====================================================

    async function cargarEmpresas() {

      try {

        const respuesta =
          await peticionAPI(
            "/api/empresas"
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          crearMessage.textContent =
            datos.message ||
            "No se han podido cargar las empresas.";

          return;
        }


        empresaSelect.innerHTML =
          `
            <option value="">
              Selecciona una empresa
            </option>
          `;


        datos.empresas.forEach(
          empresa => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              empresa.id;


            option.textContent =
              empresa.nombre;


            empresaSelect.appendChild(
              option
            );

          }
        );


        editarEmpresaSelect.innerHTML =
          `
            <option value="">
              Selecciona una empresa
            </option>
          `;


        datos.empresas.forEach(
          empresa => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              empresa.id;


            option.textContent =
              empresa.nombre;


            editarEmpresaSelect.appendChild(
              option
            );

          }
        );

      } catch (error) {

        console.error(
          "Error cargando empresas:",
          error
        );


        crearMessage.textContent =
          "No se ha podido conectar con el servidor.";

      }

    }



    // =====================================================
    // CARGAR OFICINAS PARA CREAR
    // =====================================================

    async function cargarOficinas(
      empresaId
    ) {

      oficinaSelect.innerHTML =
        `
          <option value="">
            Cargando oficinas...
          </option>
        `;


      if (!empresaId) {

        oficinaSelect.innerHTML =
          `
            <option value="">
              Selecciona una oficina
            </option>
          `;

        return;
      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/empresas/${empresaId}/oficinas`
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          oficinaSelect.innerHTML =
            `
              <option value="">
                No se han podido cargar las oficinas
              </option>
            `;

          return;
        }


        oficinaSelect.innerHTML =
          `
            <option value="">
              Selecciona una oficina
            </option>
          `;


        datos.oficinas
          .filter(
            oficina =>
              oficina.activo
          )
          .forEach(
            oficina => {

              const option =
                document.createElement(
                  "option"
                );


              option.value =
                oficina.id;


              option.textContent =
                oficina.nombre;


              oficinaSelect.appendChild(
                option
              );

            }
          );

      } catch (error) {

        console.error(
          "Error cargando oficinas:",
          error
        );


        oficinaSelect.innerHTML =
          `
            <option value="">
              Error cargando oficinas
            </option>
          `;

      }

    }



    // =====================================================
    // CARGAR OFICINAS PARA EDITAR
    // =====================================================

    async function cargarOficinasEdicion(
      empresaId,
      oficinaSeleccionada = ""
    ) {

      editarOficinaSelect.innerHTML =
        `
          <option value="">
            Cargando oficinas...
          </option>
        `;


      if (!empresaId) {

        editarOficinaSelect.innerHTML =
          `
            <option value="">
              Selecciona una oficina
            </option>
          `;

        return;
      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/empresas/${empresaId}/oficinas`
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          editarOficinaSelect.innerHTML =
            `
              <option value="">
                No se han podido cargar las oficinas
              </option>
            `;

          return;
        }


        editarOficinaSelect.innerHTML =
          `
            <option value="">
              Selecciona una oficina
            </option>
          `;


        datos.oficinas
          .filter(
            oficina =>
              oficina.activo ||
              oficina.id === oficinaSeleccionada
          )
          .forEach(
            oficina => {

              const option =
                document.createElement(
                  "option"
                );


              option.value =
                oficina.id;


              option.textContent =
                oficina.nombre;


              if (
                oficina.id === oficinaSeleccionada
              ) {

                option.selected =
                  true;

              }


              editarOficinaSelect.appendChild(
                option
              );

            }
          );

      } catch (error) {

        console.error(
          "Error cargando oficinas para edición:",
          error
        );


        editarOficinaSelect.innerHTML =
          `
            <option value="">
              Error cargando oficinas
            </option>
          `;

      }

    }



    // =====================================================
    // CAMBIO DE EMPRESA AL CREAR
    // =====================================================

    empresaSelect.addEventListener(
      "change",
      () => {

        cargarOficinas(
          empresaSelect.value
        );

      }
    );



    // =====================================================
    // CAMBIO DE EMPRESA AL EDITAR
    // =====================================================

    editarEmpresaSelect.addEventListener(
      "change",
      () => {

        cargarOficinasEdicion(
          editarEmpresaSelect.value
        );

      }
    );



    // =====================================================
    // CARGAR CLIENTES
    // =====================================================

    async function cargarClientes() {

      clientesContainer.innerHTML =
        "Cargando clientes...";


      listadoMessage.textContent =
        "";


      try {

        const respuesta =
          await peticionAPI(
            "/api/clientes"
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          clientesContainer.innerHTML =
            "";


          listadoMessage.textContent =
            datos.message ||
            "No se han podido cargar los clientes.";

          return;
        }


        if (
          !Array.isArray(
            datos.clientes
          ) ||
          datos.clientes.length === 0
        ) {

          clientesContainer.innerHTML =
            "<p>No hay clientes disponibles.</p>";

          return;
        }


        clientesContainer.innerHTML =
          "";


        datos.clientes.forEach(
          cliente => {

            const article =
              document.createElement(
                "article"
              );

            article.className =
              "cliente-card";


            // =================================================
            // NOMBRE
            // =================================================

            const titulo =
              document.createElement(
                "h3"
              );

            "cif"

          )

          )

          .trim();

          .getElementById(
            "dniAdministrador"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();

          .getElementById(

          )

      }


      const boton =

      boton.disabled =

      boton.textContent =
        "Creando...";


      try {

        const respuesta =

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                cif,

                email,
                telefono,
                empresaId,

            }
          );


        const datos =

          !datos.ok
        ) {

    // =====================================================
    // ASIGNAR TRABAJADOR
    // =====================================================

    async function asignarTrabajador(
      cliente
    ) {

      try {

        const respuesta =
          await peticionAPI(
            "/api/trabajadores"
          );


        const datos =
          await respuesta.json();


        if (
          !respuesta.ok ||
          !datos.ok
        ) {

          alert(
            datos.message ||
            "No se han podido cargar los trabajadores."
          );

          return;
        }


        if (
          !Array.isArray(
            datos.trabajadores
          ) ||
          datos.trabajadores.length === 0
        ) {

          alert(
            "No hay trabajadores disponibles."
          );

          return;
        }


        const trabajadores =
          datos.trabajadores
            .filter(
              trabajador =>
                trabajador.usuario?.activo !== false
            );


        if (
          trabajadores.length === 0
        ) {

          alert(
            "No hay trabajadores activos disponibles."
          );

          return;
        }


        let mensaje =
          "Selecciona el trabajador mediante su número:\n\n";


        trabajadores.forEach(
          (
            trabajador,
            indice
          ) => {

            mensaje +=
              `${indice + 1}. ${
                trabajador.usuario?.nombre ||
                trabajador.nombre ||
                "-"
              }\n`;

          }
        );


        const seleccion =
          prompt(
            mensaje
          );


        if (
          seleccion === null
        ) {

          return;
        }


        const indice =
          Number(
            seleccion
          ) - 1;


        if (
          !Number.isInteger(
            indice
          ) ||
          indice < 0 ||
          indice >= trabajadores.length
        ) {

          alert(
            "Selección no válida."
          );

          return;
        }


        const trabajadorSeleccionado =
          trabajadores[
            indice
          ];


        const confirmar =
          confirm(
            `¿Asignar el cliente "${cliente.nombre}" a "${trabajadorSeleccionado.usuario?.nombre || trabajadorSeleccionado.nombre}"?`
          );


        if (!confirmar) {

          return;
        }


        const respuestaAsignacion =
          await peticionAPI(
            `/api/clientes/${cliente.id}/asignar-trabajador`,
            {
              method: "PATCH",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                trabajadorId:
                  trabajadorSeleccionado.id
              })
            }
          );


        const datosAsignacion =
          await respuestaAsignacion.json();


        if (
          !respuestaAsignacion.ok ||
          !datosAsignacion.ok
        ) {

          alert(
            datosAsignacion.message ||
            "No se ha podido asignar el trabajador."
          );

          return;
        }


        alert(
          "Trabajador asignado correctamente."
        );


        await cargarClientes();

      } catch (error) {

        console.error(
          "Error asignando trabajador:",
          error
        );


        alert(
          "No se ha podido conectar con el servidor."
        );

      }

    }
