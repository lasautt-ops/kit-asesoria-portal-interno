
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tareas - Kit Gestión Asesoría</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

</head>


<body>


  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

    <div class="portal-header-left">

      <a
        href="../../index.html"
        class="btn"
        style="display: inline-block; margin-bottom: 10px;"
      >
        ← Volver al panel
      </a>

      <h1>
        Tareas
      </h1>

      <p id="usuarioCabecera">
        Cargando...
      </p>

    </div>


    <div class="portal-header-right">

      <button
        id="cerrarSesion"
        class="btn btn-danger"
        type="button"
      >
        Cerrar sesión
      </button>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO
       ===================================================== -->

  <main class="portal-container">


    <section class="welcome-section">

      <h2>
        Gestión de tareas
      </h2>

      <p>
        Consulta y gestiona las tareas de la asesoría.
      </p>

    </section>



    <!-- =====================================================
         TAREAS
         ===================================================== -->

    <section class="dashboard-section">

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 15px;
          flex-wrap: wrap;
          margin-bottom: 20px;
        "
      >

        <h2>
          Tareas
        </h2>

        <button
          id="btnNuevaTarea"
          class="btn"
          type="button"
        >
          + Nueva tarea
        </button>

      </div>



      <!-- =====================================================
           FILTROS
           ===================================================== -->

      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          gap: 15px;
          margin-bottom: 25px;
        "
      >

        <div>

          <label for="filtroEstado">
            Estado
          </label>

          <select
            id="filtroEstado"
            class="form-control"
          >

            <option value="">
              Todos
            </option>

            <option value="PENDIENTE">
              Pendiente
            </option>

            <option value="EN_PROCESO">
              En proceso
            </option>

            <option value="COMPLETADA">
              Completada
            </option>

            <option value="CANCELADA">
              Cancelada
            </option>

          </select>

        </div>


        <div>

          <label for="filtroPrioridad">
            Prioridad
          </label>

          <select
            id="filtroPrioridad"
            class="form-control"
          >

            <option value="">
              Todas
            </option>

            <option value="BAJA">
              Baja
            </option>

            <option value="MEDIA">
              Media
            </option>

            <option value="ALTA">
              Alta
            </option>

            <option value="URGENTE">
              Urgente
            </option>

          </select>

        </div>


        <div id="contenedorFiltroOficina">

          <label for="filtroOficina">
            Oficina
          </label>

          <select
            id="filtroOficina"
            class="form-control"
          >

            <option value="">
              Todas
            </option>

          </select>

        </div>


        <div id="contenedorFiltroCliente">

          <label for="filtroCliente">
            Cliente
          </label>

          <select
            id="filtroCliente"
            class="form-control"
          >

            <option value="">
              Todos
            </option>

          </select>

        </div>


        <div id="contenedorFiltroAsignado">

          <label for="filtroAsignado">
            Asignado a
          </label>

          <select
            id="filtroAsignado"
            class="form-control"
          >

            <option value="">
              Todos
            </option>

          </select>

        </div>

      </div>



      <div id="mensajeTareas"></div>


      <div
        id="listaTareas"
        style="
          display: flex;
          flex-direction: column;
          gap: 15px;
        "
      ></div>

    </section>

  </main>



  <!-- =====================================================
       MODAL NUEVA / EDITAR TAREA
       ===================================================== -->

  <div
    id="modalTarea"
    class="modal"
    style="display: none;"
  >

    <div class="modal-content">

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
        "
      >

        <h2 id="tituloModalTarea">
          Nueva tarea
        </h2>

        <button
          id="cerrarModalTarea"
          class="btn"
          type="button"
        >
          ×
        </button>

      </div>


      <form id="formTarea">

        <input
          type="hidden"
          id="tareaId"
        >


        <div class="form-group">

          <label for="tituloTarea">
            Título
          </label>

          <input
            type="text"
            id="tituloTarea"
            required
          >

        </div>


        <div class="form-group">

          <label for="descripcionTarea">
            Descripción
          </label>

          <textarea
            id="descripcionTarea"
            rows="4"
          ></textarea>

        </div>


        <div class="form-group">

          <label for="prioridadTarea">
            Prioridad
          </label>

          <select id="prioridadTarea">

            <option value="BAJA">
              Baja
            </option>

            <option value="MEDIA" selected>
              Media
            </option>

            <option value="ALTA">
              Alta
            </option>

            <option value="URGENTE">
              Urgente
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="estadoTarea">
            Estado
          </label>

          <select id="estadoTarea">

            <option value="PENDIENTE">
              Pendiente
            </option>

            <option value="EN_PROCESO">
              En proceso
            </option>

            <option value="COMPLETADA">
              Completada
            </option>

            <option value="CANCELADA">
              Cancelada
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="fechaLimiteTarea">
            Fecha límite
          </label>

          <input
            type="datetime-local"
            id="fechaLimiteTarea"
          >

        </div>


        <div
          class="form-group"
          id="grupoEmpresaTarea"
        >

          <label for="empresaTarea">
            Empresa
          </label>

          <select
            id="empresaTarea"
          >

            <option value="">
              Seleccionar empresa
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="oficinaTarea">
            Oficina
          </label>

          <select id="oficinaTarea">

            <option value="">
              Sin oficina
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="clienteTarea">
            Cliente
          </label>

          <select id="clienteTarea">

            <option value="">
              Sin cliente
            </option>

          </select>

        </div>


        <div
          class="form-group"
          id="grupoAsignadoTarea"
        >

          <label for="asignadoTarea">
            Asignar a
          </label>

          <select id="asignadoTarea">

            <option value="">
              Sin asignar
            </option>

          </select>

        </div>


        <div
          id="mensajeFormularioTarea"
          style="margin-top: 15px;"
        ></div>


        <div
          style="
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
          "
        >

          <button
            type="button"
            id="btnCancelarTarea"
            class="btn"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn"
          >
            Guardar tarea
          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =====================================================
       JAVASCRIPT COMÚN
       ===================================================== -->

  <script src="../../js/comun.js"></script>



  <!-- =====================================================
       JAVASCRIPT DEL MÓDULO
       ===================================================== -->

  <script>

    // =====================================================
    // SESIÓN
    // =====================================================

    if (!comprobarSesion()) {

      throw new Error("Sesión no válida");

    }


    const usuario = obtenerUsuario();


    document
      .getElementById("usuarioCabecera")
      .textContent =
        `${usuario.nombre} · ${usuario.rol}`;


    document
      .getElementById("cerrarSesion")
      .addEventListener(
        "click",
        cerrarSesion
      );



    // =====================================================
    // ELEMENTOS
    // =====================================================

    const listaTareas =
      document.getElementById("listaTareas");

    const mensajeTareas =
      document.getElementById("mensajeTareas");

    const modalTarea =
      document.getElementById("modalTarea");

    const formTarea =
      document.getElementById("formTarea");

    const empresaTarea =
      document.getElementById("empresaTarea");

    const oficinaTarea =
      document.getElementById("oficinaTarea");

    const clienteTarea =
      document.getElementById("clienteTarea");

    const asignadoTarea =
      document.getElementById("asignadoTarea");



    let empresas = [];
    let oficinas = [];
    let clientes = [];
    let trabajadores = [];
    let tareas = [];



    // =====================================================
    // MENSAJES
    // =====================================================

    function mostrarMensaje(elemento, texto, tipo = "info") {

      elemento.innerHTML = `
        <div
          style="
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
          "
        >
          ${texto}
        </div>
      `;

    }



    // =====================================================
    // CARGAR EMPRESAS
    // =====================================================

    async function cargarEmpresas() {

      try {

        const respuesta =
          await peticionAPI("/api/empresas");

        if (!respuesta.ok) {

          throw new Error(
            respuesta.message ||
            "No se pudieron cargar las empresas"
          );

        }

        empresas =
          respuesta.empresas || [];

        empresaTarea.innerHTML = `
          <option value="">
            Seleccionar empresa
          </option>
        `;

        empresas.forEach(empresa => {

          const option =
            document.createElement("option");

          option.value =
            empresa.id;

          option.textContent =
            empresa.nombre;

          empresaTarea.appendChild(option);

        });

        // ADMIN trabaja únicamente con su empresa
        if (
          usuario.rol === "ADMIN" &&
          usuario.empresaId
        ) {

          empresaTarea.value =
            usuario.empresaId;

          empresaTarea.disabled = true;

          await cargarDatosEmpresa(
            usuario.empresaId
          );

        }

        // DIRECTOR y TRABAJADOR también tienen
        // una empresa determinada
        if (
          (
            usuario.rol === "DIRECTOR" ||
            usuario.rol === "TRABAJADOR"
          ) &&
          usuario.empresaId
        ) {

          empresaTarea.value =
            usuario.empresaId;

          empresaTarea.disabled = true;

          await cargarDatosEmpresa(
            usuario.empresaId
          );

        }

      } catch (error) {

        console.error(
          "Error cargando empresas:",
          error
        );

        mostrarMensaje(
          mensajeTareas,
          "No se pudieron cargar las empresas."
        );

      }

    }



    // =====================================================
    // CARGAR DATOS DE EMPRESA
    // =====================================================

    async function cargarDatosEmpresa(empresaId) {

      await Promise.all([
        cargarOficinas(empresaId),
        cargarClientes(empresaId),
        cargarTrabajadores(empresaId)
      ]);

    }



    // =====================================================
    // CARGAR OFICINAS
    // =====================================================

    async function cargarOficinas(empresaId) {

      try {

        const respuesta =
          await peticionAPI(
            `/api/empresas/${empresaId}/oficinas`
          );

        if (!respuesta.ok) {

          throw new Error(
            respuesta.message ||
            "No se pudieron cargar las oficinas"
          );

        }

        oficinas =
          respuesta.oficinas || [];

        oficinaTarea.innerHTML = `
          <option value="">
            Sin oficina
          </option>
        `;

        oficinas.forEach(oficina => {

          const option =
            document.createElement("option");

          option.value =
            oficina.id;

          option.textContent =
            oficina.nombre;

          oficinaTarea.appendChild(option);

        });

        // DIRECTOR / TRABAJADOR únicamente pueden
        // trabajar con su oficina
        if (
          (
            usuario.rol === "DIRECTOR" ||
            usuario.rol === "TRABAJADOR"
          ) &&
          usuario.oficinaId
        ) {

          oficinaTarea.value =
            usuario.oficinaId;

          oficinaTarea.disabled = true;

        }

      } catch (error) {

        console.error(
          "Error cargando oficinas:",
          error
        );

      }

    }



    // =====================================================
    // CARGAR CLIENTES
    // =====================================================

    async function cargarClientes(empresaId) {

      try {

        const respuesta =
          await peticionAPI(
            `/api/clientes?empresaId=${encodeURIComponent(empresaId)}`
          );

        if (!respuesta.ok) {

          throw new Error(
            respuesta.message ||
            "No se pudieron cargar los clientes"
          );

        }

        clientes =
          respuesta.clientes || [];

        actualizarClientes();

      } catch (error) {

        console.error(
          "Error cargando clientes:",
          error
        );

      }

    }



    // =====================================================
    // CARGAR TRABAJADORES
    // =====================================================

    async function cargarTrabajadores(empresaId) {

      try {

        const respuesta =
          await peticionAPI(
            `/api/trabajadores?empresaId=${encodeURIComponent(empresaId)}`
          );

        if (!respuesta.ok) {

          throw new Error(
            respuesta.message ||
            "No se pudieron cargar los trabajadores"
          );

        }

        trabajadores =
          respuesta.trabajadores || [];

        actualizarAsignados();

      } catch (error) {

        console.error(
          "Error cargando trabajadores:",
          error
        );

      }

    }



    // =====================================================
    // ACTUALIZAR CLIENTES SEGÚN OFICINA
    // =====================================================

    function actualizarClientes() {

      const oficinaId =
        oficinaTarea.value;

      clienteTarea.innerHTML = `
        <option value="">
          Sin cliente
        </option>
      `;

      clientes
        .filter(cliente => {

          if (!oficinaId) {
            return true;
          }

          return cliente.oficinaId === oficinaId;

        })
        .forEach(cliente => {

          const option =
            document.createElement("option");

          option.value =
            cliente.id;

          option.textContent =
            cliente.nombre;

          clienteTarea.appendChild(option);

        });

    }



    // =====================================================
    // ACTUALIZAR ASIGNADOS
    // =====================================================

    function actualizarAsignados() {

      const oficinaId =
        oficinaTarea.value;

      asignadoTarea.innerHTML = `
        <option value="">
          Sin asignar
        </option>
      `;

      trabajadores
        .filter(trabajador => {

          if (!oficinaId) {
            return true;
          }

          return trabajador.oficinaId === oficinaId;

        })
        .forEach(trabajador => {

          const option =
            document.createElement("option");

          option.value =
            trabajador.usuarioId ||
            trabajador.usuario?.id;

          option.textContent =
            trabajador.nombre ||
            trabajador.usuario?.nombre ||
            "Trabajador";

          asignadoTarea.appendChild(option);

        });

    }



    // =====================================================
    // CAMBIO DE EMPRESA
    // =====================================================

    empresaTarea.addEventListener(
      "change",
      async () => {

        const empresaId =
          empresaTarea.value;

        oficinaTarea.innerHTML = `
          <option value="">
            Sin oficina
          </option>
        `;

        clienteTarea.innerHTML = `
          <option value="">
            Sin cliente
          </option>
        `;

        asignadoTarea.innerHTML = `
          <option value="">
            Sin asignar
          </option>
        `;

        oficinas = [];
        clientes = [];
        trabajadores = [];

        if (!empresaId) {
          return;
        }

        await cargarDatosEmpresa(
          empresaId
        );

      }
    );



    // =====================================================
    // CAMBIO DE OFICINA
    // =====================================================

    oficinaTarea.addEventListener(
      "change",
      () => {

        actualizarClientes();
        actualizarAsignados();

      }
    );



    // =====================================================
    // CARGAR TAREAS
    // =====================================================

    async function cargarTareas() {

      try {

        mensajeTareas.innerHTML = "";

        const respuesta =
          await peticionAPI("/api/tareas");

        if (!respuesta.ok) {

          throw new Error(
            respuesta.message ||
            "No se pudieron cargar las tareas"
          );

        }

        tareas =
          respuesta.tareas || [];

        renderizarTareas();

      } catch (error) {

        console.error(
          "Error cargando tareas:",
          error
        );

        mostrarMensaje(
          mensajeTareas,
          "No se pudieron cargar las tareas."
        );

      }

    }



    // =====================================================
    // RENDERIZAR TAREAS
    // =====================================================

    function renderizarTareas() {

      const filtroEstado =
        document.getElementById(
          "filtroEstado"
        ).value;

      const filtroPrioridad =
        document.getElementById(
          "filtroPrioridad"
        ).value;

      const filtroOficina =
        document.getElementById(
          "filtroOficina"
        ).value;

      const filtroCliente =
        document.getElementById(
          "filtroCliente"
        ).value;

      const filtroAsignado =
        document.getElementById(
          "filtroAsignado"
        ).value;


      const tareasFiltradas =
        tareas.filter(tarea => {

          if (
            filtroEstado &&
            tarea.estado !== filtroEstado
          ) {
            return false;
          }

          if (
            filtroPrioridad &&
            tarea.prioridad !== filtroPrioridad
          ) {
            return false;
          }

          if (
            filtroOficina &&
            tarea.oficinaId !== filtroOficina
          ) {
            return false;
          }

          if (
            filtroCliente &&
            tarea.clienteId !== filtroCliente
          ) {
            return false;
          }

          if (
            filtroAsignado &&
            tarea.asignadoAUsuarioId !== filtroAsignado
          ) {
            return false;
          }

          return true;

        });


      listaTareas.innerHTML = "";


      if (!tareasFiltradas.length) {

        listaTareas.innerHTML = `
          <div class="module-card">
            <p>
              No hay tareas que coincidan con los filtros.
            </p>
          </div>
        `;

        return;

      }


      tareasFiltradas.forEach(tarea => {

        const tarjeta =
          document.createElement("div");

        tarjeta.className =
          "module-card";


        tarjeta.innerHTML = `

          <div>

            <h3>
              ${escapeHTML(tarea.titulo)}
            </h3>

            <p>
              ${escapeHTML(
                tarea.descripcion ||
                "Sin descripción"
              )}
            </p>

            <p>
              <strong>Estado:</strong>
              ${formatearEstado(tarea.estado)}
            </p>

            <p>
              <strong>Prioridad:</strong>
              ${formatearPrioridad(tarea.prioridad)}
            </p>

            <p>
              <strong>Empresa:</strong>
              ${escapeHTML(
                tarea.empresa?.nombre ||
                "Sin empresa"
              )}
            </p>

            <p>
              <strong>Oficina:</strong>
              ${escapeHTML(
                tarea.oficina?.nombre ||
                "Sin oficina"
              )}
            </p>

            <p>
              <strong>Cliente:</strong>
              ${escapeHTML(
                tarea.cliente?.nombre ||
                "Sin cliente"
              )}
            </p>

            <p>
              <strong>Asignado a:</strong>
              ${escapeHTML(
                tarea.asignadoAUsuario?.nombre ||
                "Sin asignar"
              )}
            </p>

            <p>
              <strong>Fecha límite:</strong>
              ${
                tarea.fechaLimite
                  ? formatearFecha(tarea.fechaLimite)
                  : "Sin fecha límite"
              }
            </p>

            <div
              style="
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                margin-top: 15px;
              "
            >

              ${
                usuario.rol !== "CLIENTE"
                  ? `
                    <button
                      class="btn"
                      type="button"
                      onclick="editarTarea('${tarea.id}')"
                    >
                      Editar
                    </button>
                  `
                  : ""
              }

              ${
                (
                  usuario.rol === "SUPERADMIN" ||
                  usuario.rol === "ADMIN" ||
                  usuario.rol === "DIRECTOR"
                )
                  ? `
                    <button
                      class="btn btn-danger"
                      type="button"
                      onclick="eliminarTarea('${tarea.id}')"
                    >
                      Eliminar
                    </button>
                  `
                  : ""
              }

            </div>

          </div>

        `;


        listaTareas.appendChild(tarjeta);

      });

    }



    // =====================================================
    // NUEVA TAREA
    // =====================================================

    document
      .getElementById("btnNuevaTarea")
      .addEventListener(
        "click",
        () => {

          formTarea.reset();

          document
            .getElementById("tareaId")
            .value = "";

          document
            .getElementById("tituloModalTarea")
            .textContent =
              "Nueva tarea";

          document
            .getElementById("mensajeFormularioTarea")
            .innerHTML = "";

          oficinaTarea.disabled = false;
          empresaTarea.disabled =
            (
              usuario.rol === "ADMIN" ||
              usuario.rol === "DIRECTOR" ||
              usuario.rol === "TRABAJADOR"
            );

          if (usuario.empresaId) {

            empresaTarea.value =
              usuario.empresaId;

            cargarDatosEmpresa(
              usuario.empresaId
            );

          }

          if (usuario.oficinaId) {

            oficinaTarea.value =
              usuario.oficinaId;

            oficinaTarea.disabled = true;

          }

          modalTarea.style.display =
            "flex";

        }
      );



    // =====================================================
    // CERRAR MODAL
    // =====================================================

    function cerrarModal() {

      modalTarea.style.display =
        "none";

    }


    document
      .getElementById("cerrarModalTarea")
      .addEventListener(
        "click",
        cerrarModal
      );


    document
      .getElementById("btnCancelarTarea")
      .addEventListener(
        "click",
        cerrarModal
      );



    // =====================================================
    // GUARDAR TAREA
    // =====================================================

    formTarea.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const mensaje =
          document.getElementById(
            "mensajeFormularioTarea"
          );


        try {

          mensaje.innerHTML = "";


          const tareaId =
            document
              .getElementById("tareaId")
              .value;


          const empresaId =
            empresaTarea.value;


          if (!empresaId) {

            mostrarMensaje(
              mensaje,
              "Debes seleccionar una empresa."
            );

            return;

          }


          const datos = {

            titulo:
              document
                .getElementById("tituloTarea")
                .value
                .trim(),

            descripcion:
              document
                .getElementById("descripcionTarea")
                .value
                .trim(),

            prioridad:
              document
                .getElementById("prioridadTarea")
                .value,

            estado:
              document
                .getElementById("estadoTarea")
                .value,

            fechaLimite:
              document
                .getElementById("fechaLimiteTarea")
                .value || null,

            empresaId,

            oficinaId:
              oficinaTarea.value || null,

            clienteId:
              clienteTarea.value || null,

            asignadoAUsuarioId:
              asignadoTarea.value || null

          };


          let respuesta;


          if (tareaId) {

            respuesta =
              await peticionAPI(
                `/api/tareas/${tareaId}`,
                {
                  method: "PATCH",
                  body: JSON.stringify(datos)
                }
              );

          } else {

            respuesta =
              await peticionAPI(
                "/api/tareas",
                {
                  method: "POST",
                  body: JSON.stringify(datos)
                }
              );

          }


          if (!respuesta.ok) {

            throw new Error(
              respuesta.message ||
              "No se pudo guardar la tarea"
            );

          }


          cerrarModal();

          await cargarTareas();

        } catch (error) {

          console.error(
            "Error guardando tarea:",
            error
          );

          mostrarMensaje(
            mensaje,
            error.message ||
            "No se pudo guardar la tarea."
          );

        }

      }
    );



    // =====================================================
    // EDITAR TAREA
    // =====================================================

    async function editarTarea(id) {

      try {

        const respuesta =
          await peticionAPI(
            `/api/tareas/${id}`
          );

        if (!respuesta.ok) {

          throw new Error(
            respuesta.message ||
            "No se pudo cargar la tarea"
          );

        }

        const tarea =
          respuesta.tarea;


        document
          .getElementById("tareaId")
          .value =
            tarea.id;

        document
          .getElementById("tituloTarea")
          .value =
            tarea.titulo || "";

        document
          .getElementById("descripcionTarea")
          .value =
            tarea.descripcion || "";

        document
          .getElementById("prioridadTarea")
          .value =
            tarea.prioridad || "MEDIA";

        document
          .getElementById("estadoTarea")
          .value =
            tarea.estado || "PENDIENTE";

        document
          .getElementById("fechaLimiteTarea")
          .value =
            convertirFechaLocal(
              tarea.fechaLimite
            );


        empresaTarea.value =
          tarea.empresaId;


        await cargarDatosEmpresa(
          tarea.empresaId
        );


        oficinaTarea.disabled = false;


        if (tarea.oficinaId) {

          oficinaTarea.value =
            tarea.oficinaId;

        }


        actualizarClientes();
        actualizarAsignados();


        if (tarea.clienteId) {

          clienteTarea.value =
            tarea.clienteId;

        }


        if (tarea.asignadoAUsuarioId) {

          asignadoTarea.value =
            tarea.asignadoAUsuarioId;

        }


        if (
          usuario.rol === "ADMIN" ||
          usuario.rol === "DIRECTOR" ||
          usuario.rol === "TRABAJADOR"
        ) {

          empresaTarea.disabled = true;

        }


        if (
          (
            usuario.rol === "DIRECTOR" ||
            usuario.rol === "TRABAJADOR"
          ) &&
          usuario.oficinaId
        ) {

          oficinaTarea.disabled = true;

        }


        document
          .getElementById("tituloModalTarea")
          .textContent =
            "Editar tarea";


        modalTarea.style.display =
          "flex";

      } catch (error) {

        console.error(
          "Error editando tarea:",
          error
        );

        alert(
          error.message ||
          "No se pudo cargar la tarea."
        );

      }

    }



    // =====================================================
    // ELIMINAR TAREA
    // =====================================================

    async function eliminarTarea(id) {

      if (
        !confirm(
          "¿Seguro que quieres eliminar esta tarea?"
        )
      ) {

        return;

      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/tareas/${id}`,
            {
              method: "DELETE"
            }
          );


        if (!respuesta.ok) {

          throw new Error(
            respuesta.message ||
            "No se pudo eliminar la tarea"
          );

        }


        await cargarTareas();

      } catch (error) {

        console.error(
          "Error eliminando tarea:",
          error
        );

        alert(
          error.message ||
          "No se pudo eliminar la tarea."
        );

      }

    }



    // =====================================================
    // FILTROS
    // =====================================================

    [
      "filtroEstado",
      "filtroPrioridad",
      "filtroOficina",
      "filtroCliente",
      "filtroAsignado"
    ]
      .forEach(id => {

        document
          .getElementById(id)
          .addEventListener(
            "change",
            renderizarTareas
          );

      });



    // =====================================================
    // PREPARAR FILTROS
    // =====================================================

    function prepararFiltros() {

      const filtroOficina =
        document.getElementById(
          "filtroOficina"
        );

      const filtroCliente =
        document.getElementById(
          "filtroCliente"
        );

      const filtroAsignado =
        document.getElementById(
          "filtroAsignado"
        );


      filtroOficina.innerHTML = `
        <option value="">
          Todas
        </option>
      `;

      filtroCliente.innerHTML = `
        <option value="">
          Todos
        </option>
      `;

      filtroAsignado.innerHTML = `
        <option value="">
          Todos
        </option>
      `;


      oficinas.forEach(oficina => {

        const option =
          document.createElement("option");

        option.value =
          oficina.id;

        option.textContent =
          oficina.nombre;

        filtroOficina.appendChild(option);

      });


      clientes.forEach(cliente => {

        const option =
          document.createElement("option");

        option.value =
          cliente.id;

        option.textContent =
          cliente.nombre;

        filtroCliente.appendChild(option);

      });


      trabajadores.forEach(trabajador => {

        const option =
          document.createElement("option");

        option.value =
          trabajador.usuarioId ||
          trabajador.usuario?.id;

        option.textContent =
          trabajador.nombre ||
          trabajador.usuario?.nombre ||
          "Trabajador";

        filtroAsignado.appendChild(option);

      });

    }



    // =====================================================
    // UTILIDADES
    // =====================================================

    function formatearEstado(estado) {

      const estados = {

        PENDIENTE: "Pendiente",

        EN_PROCESO: "En proceso",

        COMPLETADA: "Completada",

        CANCELADA: "Cancelada"

      };

      return estados[estado] || estado || "";

    }


    function formatearPrioridad(prioridad) {

      const prioridades = {

        BAJA: "Baja",

        MEDIA: "Media",

        ALTA: "Alta",

        URGENTE: "Urgente"

      };

      return prioridades[prioridad] ||
        prioridad ||
        "";

    }


    function convertirFechaLocal(fecha) {

      if (!fecha) {
        return "";
      }

      const date =
        new Date(fecha);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }

      const offset =
        date.getTimezoneOffset();

      const localDate =
        new Date(
          date.getTime() -
          offset * 60000
        );

      return localDate
        .toISOString()
        .slice(0, 16);

    }


    function escapeHTML(texto) {

      return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }



    // =====================================================
    // INICIALIZACIÓN
    // =====================================================

    async function iniciarModulo() {

      // Cargar tareas directamente.
      await cargarTareas();

      // Cargar empresas y datos relacionados.
      await cargarEmpresas();

      // Preparar filtros después de cargar
      // los datos auxiliares.
      prepararFiltros();

    }


    iniciarModulo();

  </script>
