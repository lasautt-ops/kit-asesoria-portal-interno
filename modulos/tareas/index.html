
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tareas - Kit Gestión Asesoría</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

</head>


<body>


  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

    <div class="portal-header-left">

      <a
        href="../../index.html"
        class="btn"
        style="display: inline-block; margin-bottom: 10px;"
      >
        ← Volver al panel
      </a>

      <h1>
        Tareas
      </h1>

      <p id="usuarioCabecera">
        Cargando...
      </p>

    </div>


    <div class="portal-header-right">

      <button
        id="cerrarSesion"
        class="btn btn-danger"
        type="button"
      >
        Cerrar sesión
      </button>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO
       ===================================================== -->

  <main class="portal-container">


    <section class="welcome-section">

      <h2>
        Gestión de tareas
      </h2>

      <p>
        Consulta y gestiona las tareas de la asesoría.
      </p>

    </section>



    <!-- =====================================================
         ACCIONES
         ===================================================== -->

    <section class="dashboard-section">

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 15px;
          flex-wrap: wrap;
          margin-bottom: 20px;
        "
      >

        <h2>
          Tareas
        </h2>

        <button
          id="btnNuevaTarea"
          class="btn"
          type="button"
        >
          + Nueva tarea
        </button>

      </div>



      <!-- =====================================================
           FILTROS
           ===================================================== -->

      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          gap: 15px;
          margin-bottom: 25px;
        "
      >

        <div>

          <label for="filtroEstado">
            Estado
          </label>

          <select
            id="filtroEstado"
            class="form-control"
          >

            <option value="">
              Todos
            </option>

            <option value="PENDIENTE">
              Pendiente
            </option>

            <option value="EN_PROCESO">
              En proceso
            </option>

            <option value="COMPLETADA">
              Completada
            </option>

            <option value="CANCELADA">
              Cancelada
            </option>

          </select>

        </div>


        <div>

          <label for="filtroPrioridad">
            Prioridad
          </label>

          <select
            id="filtroPrioridad"
            class="form-control"
          >

            <option value="">
              Todas
            </option>

            <option value="BAJA">
              Baja
            </option>

            <option value="MEDIA">
              Media
            </option>

            <option value="ALTA">
              Alta
            </option>

          </select>

        </div>


        <div id="contenedorFiltroOficina">

          <label for="filtroOficina">
            Oficina
          </label>

          <select
            id="filtroOficina"
            class="form-control"
          >

            <option value="">
              Todas
            </option>

          </select>

        </div>


        <div id="contenedorFiltroCliente">

          <label for="filtroCliente">
            Cliente
          </label>

          <select
            id="filtroCliente"
            class="form-control"
          >

            <option value="">
              Todos
            </option>

          </select>

        </div>


        <div id="contenedorFiltroAsignado">

          <label for="filtroAsignado">
            Asignado a
          </label>

          <select
            id="filtroAsignado"
            class="form-control"
          >

            <option value="">
              Todos
            </option>

          </select>

        </div>

      </div>



      <!-- =====================================================
           MENSAJES
           ===================================================== -->

      <div id="mensajeTareas"></div>



      <!-- =====================================================
           LISTADO
           ===================================================== -->

      <div
        id="listaTareas"
        style="
          display: flex;
          flex-direction: column;
          gap: 15px;
        "
      >

      </div>

    </section>

  </main>



  <!-- =====================================================
       MODAL NUEVA / EDITAR TAREA
       ===================================================== -->

  <div
    id="modalTarea"
    class="modal"
    style="display: none;"
  >

    <div class="modal-content">

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
        "
      >

        <h2 id="tituloModalTarea">
          Nueva tarea
        </h2>

        <button
          id="cerrarModalTarea"
          class="btn"
          type="button"
        >
          ×
        </button>

      </div>


      <form id="formTarea">

        <input
          type="hidden"
          id="tareaId"
        >


        <!-- TÍTULO -->

        <div class="form-group">

          <label for="tituloTarea">
            Título
          </label>

          <input
            type="text"
            id="tituloTarea"
            name="titulo"
            required
          >

        </div>


        <!-- DESCRIPCIÓN -->

        <div class="form-group">

          <label for="descripcionTarea">
            Descripción
          </label>

          <textarea
            id="descripcionTarea"
            name="descripcion"
            rows="4"
          ></textarea>

        </div>


        <!-- PRIORIDAD -->

        <div class="form-group">

          <label for="prioridadTarea">
            Prioridad
          </label>

          <select
            id="prioridadTarea"
            name="prioridad"
          >

            <option value="BAJA">
              Baja
            </option>

            <option value="MEDIA" selected>
              Media
            </option>

            <option value="ALTA">
              Alta
            </option>

          </select>

        </div>


        <!-- ESTADO -->

        <div
          class="form-group"
          id="grupoEstadoTarea"
        >

          <label for="estadoTarea">
            Estado
          </label>

          <select
            id="estadoTarea"
            name="estado"
          >

            <option value="PENDIENTE">
              Pendiente
            </option>

            <option value="EN_PROCESO">
              En proceso
            </option>

            <option value="COMPLETADA">
              Completada
            </option>

            <option value="CANCELADA">
              Cancelada
            </option>

          </select>

        </div>


        <!-- FECHA LÍMITE -->

        <div class="form-group">

          <label for="fechaLimiteTarea">
            Fecha límite
          </label>

          <input
            type="datetime-local"
            id="fechaLimiteTarea"
            name="fechaLimite"
          >

        </div>


        <!-- EMPRESA -->

        <div
          class="form-group"
          id="grupoEmpresaTarea"
        >

          <label for="empresaTarea">
            Empresa
          </label>

          <select
            id="empresaTarea"
            name="empresaId"
          >

            <option value="">
              Seleccionar empresa
            </option>

          </select>

        </div>


        <!-- OFICINA -->

        <div
          class="form-group"
          id="grupoOficinaTarea"
        >

          <label for="oficinaTarea">
            Oficina
          </label>

          <select
            id="oficinaTarea"
            name="oficinaId"
          >

            <option value="">
              Sin oficina
            </option>

          </select>

        </div>


        <!-- CLIENTE -->

        <div
          class="form-group"
          id="grupoClienteTarea"
        >

          <label for="clienteTarea">
            Cliente
          </label>

          <select
            id="clienteTarea"
            name="clienteId"
          >

            <option value="">
              Sin cliente
            </option>

          </select>

        </div>


        <!-- ASIGNADO -->

        <div
          class="form-group"
          id="grupoAsignadoTarea"
        >

          <label for="asignadoTarea">
            Asignar a
          </label>

          <select
            id="asignadoTarea"
            name="asignadoAUsuarioId"
          >

            <option value="">
              Sin asignar
            </option>

          </select>

        </div>


        <!-- BOTONES -->

        <div
          style="
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
          "
        >

          <button
            type="button"
            id="btnCancelarTarea"
            class="btn"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn"
          >
            Guardar tarea
          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =====================================================
       JAVASCRIPT COMÚN
       ===================================================== -->

  <script src="../../js/comun.js"></script>



  <!-- =====================================================
       JAVASCRIPT DEL MÓDULO
       ===================================================== -->

  <script>

    // =====================================================
    // SESIÓN
    // =====================================================

    if (!comprobarSesion()) {

      throw new Error("Sesión no válida");

    }


    const usuario = obtenerUsuario();


    document
      .getElementById("usuarioCabecera")
      .textContent =
        `${usuario.nombre} · ${usuario.rol}`;


    document
      .getElementById("cerrarSesion")
      .addEventListener(
        "click",
        cerrarSesion
      );



    // =====================================================
    // REFERENCIAS
    // =====================================================

    const listaTareas =
      document.getElementById("listaTareas");

    const mensajeTareas =
      document.getElementById("mensajeTareas");

    const modalTarea =
      document.getElementById("modalTarea");

    const formTarea =
      document.getElementById("formTarea");

    const btnNuevaTarea =
      document.getElementById("btnNuevaTarea");

    const empresaTarea =
      document.getElementById("empresaTarea");

    const oficinaTarea =
      document.getElementById("oficinaTarea");

    const clienteTarea =
      document.getElementById("clienteTarea");

    const asignadoTarea =
      document.getElementById("asignadoTarea");

    const filtroEstado =
      document.getElementById("filtroEstado");

    const filtroPrioridad =
      document.getElementById("filtroPrioridad");

    const filtroOficina =
      document.getElementById("filtroOficina");

    const filtroCliente =
      document.getElementById("filtroCliente");

    const filtroAsignado =
      document.getElementById("filtroAsignado");



    let tareas = [];

    let empresas = [];

    let oficinas = [];

    let clientes = [];

    let usuarios = [];



    // =====================================================
    // MENSAJES
    // =====================================================

    function mostrarMensaje(
      mensaje,
      tipo = "error"
    ) {

      mensajeTareas.innerHTML = `
        <div
          style="
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: ${tipo === "ok"
              ? "#d4edda"
              : "#f8d7da"};
            color: ${tipo === "ok"
              ? "#155724"
              : "#721c24"};
          "
        >
          ${mensaje}
        </div>
      `;

    }



    // =====================================================
    // ESCAPAR HTML
    // =====================================================

    function escaparHTML(valor) {

      if (
        valor === null ||
        valor === undefined
      ) {

        return "";

      }

      return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }



    // =====================================================
    // CARGAR TAREAS
    // =====================================================

    async function cargarTareas() {

      try {

        const respuesta =
          await peticionAPI(
            "/api/tareas"
          );

        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.message ||
            "No se pudieron cargar las tareas"
          );

        }


        tareas =
          Array.isArray(datos.tareas)
            ? datos.tareas
            : [];


        renderizarTareas();

      } catch (error) {

        console.error(
          "Error cargando tareas:",
          error
        );

        mostrarMensaje(
          error.message ||
          "No se pudieron cargar las tareas"
        );

      }

    }



    // =====================================================
    // CARGAR EMPRESAS
    // Solo SUPERADMIN necesita seleccionarlas.
    // =====================================================

    async function cargarEmpresas() {

      if (
        usuario.rol !== "SUPERADMIN"
      ) {

        return;

      }


      try {

        const respuesta =
          await peticionAPI(
            "/api/empresas"
          );

        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.message ||
            "No se pudieron cargar las empresas"
          );

        }


        empresas =
          Array.isArray(datos.empresas)
            ? datos.empresas
            : [];


        empresaTarea.innerHTML = `
          <option value="">
            Seleccionar empresa
          </option>
        `;


        empresas.forEach(
          (empresa) => {

            const option =
              document.createElement("option");

            option.value =
              empresa.id;

            option.textContent =
              empresa.nombre;

            empresaTarea.appendChild(
              option
            );

          }
        );


      } catch (error) {

        console.error(
          "Error cargando empresas:",
          error
        );

        mostrarMensaje(
          error.message ||
          "No se pudieron cargar las empresas"
        );

      }

    }



    // =====================================================
    // CARGAR OFICINAS
    // =====================================================

    async function cargarOficinas(
      empresaId,
      oficinaSeleccionada = ""
    ) {

      oficinaTarea.innerHTML = `
        <option value="">
          Sin oficina
        </option>
      `;


      oficinas = [];


      if (!empresaId) {

        return;

      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/empresas/${empresaId}/oficinas`
          );

        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.message ||
            "No se pudieron cargar las oficinas"
          );

        }


        oficinas =
          Array.isArray(datos.oficinas)
            ? datos.oficinas.filter(
                (oficina) =>
                  oficina.activo !== false
              )
            : [];


        oficinas.forEach(
          (oficina) => {

            const option =
              document.createElement("option");

            option.value =
              oficina.id;

            option.textContent =
              oficina.nombre;

            oficinaTarea.appendChild(
              option
            );

          }
        );


        if (oficinaSeleccionada) {

          oficinaTarea.value =
            oficinaSeleccionada;

        }


      } catch (error) {

        console.error(
          "Error cargando oficinas:",
          error
        );

        mostrarMensaje(
          error.message ||
          "No se pudieron cargar las oficinas"
        );

      }

    }



    // =====================================================
    // CARGAR CLIENTES
    // =====================================================

    async function cargarClientes(
      empresaId
    ) {

      clienteTarea.innerHTML = `
        <option value="">
          Sin cliente
        </option>
      `;


      clientes = [];


      if (!empresaId) {

        return;

      }


      try {

        const respuesta =
          await peticionAPI(
            "/api/clientes"
          );

        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.message ||
            "No se pudieron cargar los clientes"
          );

        }


        let lista =
          Array.isArray(datos.clientes)
            ? datos.clientes
            : [];


        lista =
          lista.filter(
            (cliente) =>
              cliente.empresaId === empresaId
          );


        // TRABAJADOR:
        // el backend ya limita /api/clientes
        // a sus clientes asignados.

        clientes = lista;


        clientes.forEach(
          (cliente) => {

            const option =
              document.createElement("option");

            option.value =
              cliente.id;

            option.textContent =
              cliente.nombre;

            clienteTarea.appendChild(
              option
            );

          }
        );


      } catch (error) {

        console.error(
          "Error cargando clientes:",
          error
        );

        mostrarMensaje(
          error.message ||
          "No se pudieron cargar los clientes"
        );

      }

    }



    // =====================================================
    // CARGAR USUARIOS / TRABAJADORES
    // =====================================================

    async function cargarUsuariosAsignables(
      empresaId
    ) {

      asignadoTarea.innerHTML = `
        <option value="">
          Sin asignar
        </option>
      `;


      usuarios = [];


      if (!empresaId) {

        return;

      }


      /*
       * El backend que tenemos actualmente no dispone
       * de una ruta específica de usuarios asignables
       * para tareas dentro del bloque revisado.
       *
       * Por tanto, no hacemos una llamada inventada.
       *
       * Más adelante, si se crea esa ruta, podremos
       * conectarla aquí.
       */


    }



    // =====================================================
    // PREPARAR SELECTORES SEGÚN ROL
    // =====================================================

    async function prepararFormulario() {

      const grupoEmpresa =
        document.getElementById(
          "grupoEmpresaTarea"
        );

      const grupoOficina =
        document.getElementById(
          "grupoOficinaTarea"
        );

      const grupoCliente =
        document.getElementById(
          "grupoClienteTarea"
        );


      // ---------------------------------------------------
      // SUPERADMIN
      // ---------------------------------------------------

      if (
        usuario.rol === "SUPERADMIN"
      ) {

        grupoEmpresa.style.display =
          "block";

        grupoOficina.style.display =
          "block";

        grupoCliente.style.display =
          "block";

        empresaTarea.disabled =
          false;

        oficinaTarea.disabled =
          false;

        clienteTarea.disabled =
          false;

        await cargarEmpresas();

        return;

      }


      // ---------------------------------------------------
      // ADMIN
      // ---------------------------------------------------

      if (
        usuario.rol === "ADMIN"
      ) {

        grupoEmpresa.style.display =
          "block";

        grupoOficina.style.display =
          "block";

        grupoCliente.style.display =
          "block";

        /*
         * Para ADMIN NO se utiliza /api/empresas.
         *
         * Su empresa viene directamente de:
         *
         * usuario.empresaId
         *
         * y el backend obliga a que coincida.
         */

        empresaTarea.innerHTML = "";

        const option =
          document.createElement("option");

        option.value =
          usuario.empresaId;

        option.textContent =
          "Empresa actual";

        option.selected =
          true;

        empresaTarea.appendChild(
          option
        );

        empresaTarea.disabled =
          true;


        await cargarOficinas(
          usuario.empresaId
        );

        await cargarClientes(
          usuario.empresaId
        );

        await cargarUsuariosAsignables(
          usuario.empresaId
        );

        return;

      }


      // ---------------------------------------------------
      // DIRECTOR
      // ---------------------------------------------------

      if (
        usuario.rol === "DIRECTOR"
      ) {

        grupoEmpresa.style.display =
          "block";

        grupoOficina.style.display =
          "block";

        grupoCliente.style.display =
          "block";


        empresaTarea.innerHTML = "";

        const empresaOption =
          document.createElement("option");

        empresaOption.value =
          usuario.empresaId;

        empresaOption.textContent =
          "Empresa actual";

        empresaOption.selected =
          true;

        empresaTarea.appendChild(
          empresaOption
        );

        empresaTarea.disabled =
          true;


        oficinaTarea.innerHTML = "";

        const oficinaOption =
          document.createElement("option");

        oficinaOption.value =
          usuario.oficinaId;

        oficinaOption.textContent =
          "Oficina actual";

        oficinaOption.selected =
          true;

        oficinaTarea.appendChild(
          oficinaOption
        );

        oficinaTarea.disabled =
          true;


        await cargarClientes(
          usuario.empresaId
        );

        return;

      }


      // ---------------------------------------------------
      // TRABAJADOR
      // ---------------------------------------------------

      if (
        usuario.rol === "TRABAJADOR"
      ) {

        grupoEmpresa.style.display =
          "block";

        grupoOficina.style.display =
          "block";

        grupoCliente.style.display =
          "block";


        empresaTarea.innerHTML = "";

        const empresaOption =
          document.createElement("option");

        empresaOption.value =
          usuario.empresaId;

        empresaOption.textContent =
          "Empresa actual";

        empresaOption.selected =
          true;

        empresaTarea.appendChild(
          empresaOption
        );

        empresaTarea.disabled =
          true;


        oficinaTarea.innerHTML = "";

        const oficinaOption =
          document.createElement("option");

        oficinaOption.value =
          usuario.oficinaId;

        oficinaOption.textContent =
          "Oficina actual";

        oficinaOption.selected =
          true;

        oficinaTarea.appendChild(
          oficinaOption
        );

        oficinaTarea.disabled =
          true;


        await cargarClientes(
          usuario.empresaId
        );

        return;

      }

    }



    // =====================================================
    // ABRIR MODAL
    // =====================================================

    async function abrirModalNuevaTarea() {

      formTarea.reset();


      document
        .getElementById("tareaId")
        .value = "";


      document
        .getElementById("tituloModalTarea")
        .textContent =
          "Nueva tarea";


      empresaTarea.disabled =
        false;

      oficinaTarea.disabled =
        false;

      clienteTarea.disabled =
        false;


      await prepararFormulario();


      modalTarea.style.display =
        "block";

    }



    // =====================================================
    // CERRAR MODAL
    // =====================================================

    function cerrarModalTarea() {

      modalTarea.style.display =
        "none";

    }


    document
      .getElementById("cerrarModalTarea")
      .addEventListener(
        "click",
        cerrarModalTarea
      );


    document
      .getElementById("btnCancelarTarea")
      .addEventListener(
        "click",
        cerrarModalTarea
      );



    // =====================================================
    // CAMBIO DE EMPRESA
    // =====================================================

    empresaTarea.addEventListener(
      "change",
      async () => {

        const empresaId =
          empresaTarea.value;


        await cargarOficinas(
          empresaId
        );

        await cargarClientes(
          empresaId
        );

        await cargarUsuariosAsignables(
          empresaId
        );

      }
    );



    // =====================================================
    // CAMBIO DE OFICINA
    // =====================================================

    oficinaTarea.addEventListener(
      "change",
      async () => {

        const oficinaId =
          oficinaTarea.value;


        if (!oficinaId) {

          return;

        }


        const empresaId =
          empresaTarea.value;


        if (!empresaId) {

          return;

        }


        try {

          const respuesta =
            await peticionAPI(
              "/api/clientes"
            );

          const datos =
            await respuesta.json();


          if (!respuesta.ok || !datos.ok) {

            throw new Error(
              datos.message ||
              "No se pudieron cargar los clientes"
            );

          }


          clienteTarea.innerHTML = `
            <option value="">
              Sin cliente
            </option>
          `;


          const lista =
            (datos.clientes || [])
              .filter(
                (cliente) =>
                  cliente.empresaId === empresaId &&
                  cliente.oficinaId === oficinaId
              );


          lista.forEach(
            (cliente) => {

              const option =
                document.createElement("option");

              option.value =
                cliente.id;

              option.textContent =
                cliente.nombre;

              clienteTarea.appendChild(
                option
              );

            }
          );


        } catch (error) {

          console.error(
            "Error filtrando clientes:",
            error
          );

          mostrarMensaje(
            error.message ||
            "No se pudieron cargar los clientes"
          );

        }

      }
    );



    // =====================================================
    // GUARDAR TAREA
    // =====================================================

    formTarea.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const titulo =
          document
            .getElementById("tituloTarea")
            .value
            .trim();


        const descripcion =
          document
            .getElementById("descripcionTarea")
            .value
            .trim();


        const prioridad =
          document
            .getElementById("prioridadTarea")
            .value;


        const estado =
          document
            .getElementById("estadoTarea")
            .value;


        const fechaLimite =
          document
            .getElementById("fechaLimiteTarea")
            .value;


        /*
         * Para ADMIN / DIRECTOR / TRABAJADOR,
         * empresaTarea está deshabilitado, pero su
         * value sigue disponible en JavaScript.
         */

        const empresaId =
          empresaTarea.value;


        const oficinaId =
          oficinaTarea.value;


        const clienteId =
          clienteTarea.value;


        const asignadoAUsuarioId =
          asignadoTarea.value;


        if (!titulo) {

          mostrarMensaje(
            "El título es obligatorio"
          );

          return;

        }


        if (!empresaId) {

          mostrarMensaje(
            "Debes seleccionar una empresa"
          );

          return;

        }


        const datosEnviar = {

          titulo,

          descripcion:
            descripcion || null,

          prioridad,

          fechaLimite:
            fechaLimite || null,

          empresaId,

          oficinaId:
            oficinaId || null,

          clienteId:
            clienteId || null,

          asignadoAUsuarioId:
            asignadoAUsuarioId || null

        };


        try {

          const respuesta =
            await peticionAPI(
              "/api/tareas",
              {
                method: "POST",
                headers: {
                  "Content-Type":
                    "application/json"
                },
                body:
                  JSON.stringify(
                    datosEnviar
                  )
              }
            );


          const datos =
            await respuesta.json();


          if (!respuesta.ok || !datos.ok) {

            throw new Error(
              datos.message ||
              "No se pudo crear la tarea"
            );

          }


          cerrarModalTarea();

          mostrarMensaje(
            "Tarea creada correctamente",
            "ok"
          );


          await cargarTareas();


        } catch (error) {

          console.error(
            "Error creando tarea:",
            error
          );

          mostrarMensaje(
            error.message ||
            "No se pudo crear la tarea"
          );

        }

      }
    );



    // =====================================================
    // RENDERIZAR TAREAS
    // =====================================================

    function renderizarTareas() {

      const estadoFiltro =
        filtroEstado.value;

      const prioridadFiltro =
        filtroPrioridad.value;

      const oficinaFiltro =
        filtroOficina.value;

      const clienteFiltro =
        filtroCliente.value;

      const asignadoFiltro =
        filtroAsignado.value;


      const filtradas =
        tareas.filter(
          (tarea) => {

            if (
              estadoFiltro &&
              tarea.estado !== estadoFiltro
            ) {

              return false;

            }


            if (
              prioridadFiltro &&
              tarea.prioridad !== prioridadFiltro
            ) {

              return false;

            }


            if (
              oficinaFiltro &&
              tarea.oficinaId !== oficinaFiltro
            ) {

              return false;

            }


            if (
              clienteFiltro &&
              tarea.clienteId !== clienteFiltro
            ) {

              return false;

            }


            if (
              asignadoFiltro &&
              tarea.asignadoAUsuarioId !== asignadoFiltro
            ) {

              return false;

            }


            return true;

          }
        );


      listaTareas.innerHTML = "";


      if (
        filtradas.length === 0
      ) {

        listaTareas.innerHTML = `
          <div
            style="
              padding: 25px;
              text-align: center;
              border: 1px solid #ddd;
              border-radius: 8px;
            "
          >
            No hay tareas que mostrar.
          </div>
        `;

        return;

      }


      filtradas.forEach(
        (tarea) => {

          const tarjeta =
            document.createElement("div");


          tarjeta.style.cssText = `
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 18px;
            background: #fff;
          `;


          const fecha =
            tarea.fechaLimite
              ? formatearFecha(
                  tarea.fechaLimite
                )
              : "-";


          const oficina =
            tarea.oficina
              ? tarea.oficina.nombre
              : "Sin oficina";


          const cliente =
            tarea.cliente
              ? tarea.cliente.nombre
              : "Sin cliente";


          const asignado =
            tarea.asignadoAUsuario
              ? tarea.asignadoAUsuario.nombre
              : "Sin asignar";


          const empresa =
            tarea.empresa
              ? tarea.empresa.nombre
              : "Sin empresa";


          const creador =
            tarea.creadoPorUsuario
              ? tarea.creadoPorUsuario.nombre
              : "-";


          tarjeta.innerHTML = `

            <div
              style="
                display: flex;
                justify-content: space-between;
                gap: 15px;
                flex-wrap: wrap;
              "
            >

              <div>

                <h3 style="margin-top: 0;">
                  ${escaparHTML(
                    tarea.titulo
                  )}
                </h3>

                <p>
                  ${escaparHTML(
                    tarea.descripcion ||
                    "Sin descripción"
                  )}
                </p>

              </div>


              <div>

                <strong>
                  ${escaparHTML(
                    tarea.estado
                  )}
                </strong>

              </div>

            </div>


            <div
              style="
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(180px, 1fr));
                gap: 10px;
                margin-top: 15px;
              "
            >

              <div>
                <strong>Prioridad:</strong>
                ${escaparHTML(
                  tarea.prioridad
                )}
              </div>

              <div>
                <strong>Fecha límite:</strong>
                ${escaparHTML(
                  fecha
                )}
              </div>

              <div>
                <strong>Empresa:</strong>
                ${escaparHTML(
                  empresa
                )}
              </div>

              <div>
                <strong>Oficina:</strong>
                ${escaparHTML(
                  oficina
                )}
              </div>

              <div>
                <strong>Cliente:</strong>
                ${escaparHTML(
                  cliente
                )}
              </div>

              <div>
                <strong>Asignado a:</strong>
                ${escaparHTML(
                  asignado
                )}
              </div>

              <div>
                <strong>Creada por:</strong>
                ${escaparHTML(
                  creador
                )}
              </div>

            </div>


            <div
              style="
                display: flex;
                gap: 10px;
                margin-top: 18px;
                flex-wrap: wrap;
              "
            >

              <button
                type="button"
                class="btn btn-editar-tarea"
                data-id="${escaparHTML(
                  tarea.id
                )}"
              >
                Editar
              </button>


              ${
                (
                  usuario.rol === "SUPERADMIN" ||
                  usuario.rol === "ADMIN" ||
                  usuario.rol === "DIRECTOR"
                )
                ? `
                  <button
                    type="button"
                    class="btn btn-danger btn-eliminar-tarea"
                    data-id="${escaparHTML(
                      tarea.id
                    )}"
                  >
                    Eliminar
                  </button>
                `
                : ""
              }

            </div>

          `;


          listaTareas.appendChild(
            tarjeta
          );

        }
      );


      document
        .querySelectorAll(
          ".btn-editar-tarea"
        )
        .forEach(
          (boton) => {

            boton.addEventListener(
              "click",
              () => {

                abrirEdicionTarea(
                  boton.dataset.id
                );

              }
            );

          }
        );


      document
        .querySelectorAll(
          ".btn-eliminar-tarea"
        )
        .forEach(
          (boton) => {

            boton.addEventListener(
              "click",
              () => {

                eliminarTarea(
                  boton.dataset.id
                );

              }
            );

          }
        );

    }



    // =====================================================
    // EDITAR TAREA
    // =====================================================

    async function abrirEdicionTarea(
      id
    ) {

      try {

        const respuesta =
          await peticionAPI(
            `/api/tareas/${id}`
          );


        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.message ||
            "No se pudo obtener la tarea"
          );

        }


        const tarea =
          datos.tarea;


        document
          .getElementById("tareaId")
          .value =
            tarea.id;


        document
          .getElementById("tituloModalTarea")
          .textContent =
            "Editar tarea";


        document
          .getElementById("tituloTarea")
          .value =
            tarea.titulo || "";


        document
          .getElementById("descripcionTarea")
          .value =
            tarea.descripcion || "";


        document
          .getElementById("prioridadTarea")
          .value =
            tarea.prioridad || "MEDIA";


        document
          .getElementById("estadoTarea")
          .value =
            tarea.estado || "PENDIENTE";


        if (tarea.fechaLimite) {

          const fecha =
            new Date(
              tarea.fechaLimite
            );


          const pad =
            (numero) =>
              String(numero)
                .padStart(2, "0");


          const fechaLocal =
            `${fecha.getFullYear()}-${pad(
              fecha.getMonth() + 1
            )}-${pad(
              fecha.getDate()
            )}T${pad(
              fecha.getHours()
            )}:${pad(
              fecha.getMinutes()
            )}`;


          document
            .getElementById(
              "fechaLimiteTarea"
            )
            .value =
              fechaLocal;

        } else {

          document
            .getElementById(
              "fechaLimiteTarea"
            )
            .value = "";

        }


        empresaTarea.disabled =
          false;

        oficinaTarea.disabled =
          false;

        clienteTarea.disabled =
          false;


        if (
          usuario.rol === "SUPERADMIN"
        ) {

          await cargarEmpresas();

          empresaTarea.value =
            tarea.empresaId;

          await cargarOficinas(
            tarea.empresaId,
            tarea.oficinaId || ""
          );

          await cargarClientes(
            tarea.empresaId
          );

          clienteTarea.value =
            tarea.clienteId || "";

        } else {

          await prepararFormulario();

        }


        modalTarea.style.display =
          "block";


      } catch (error) {

        console.error(
          "Error abriendo tarea:",
          error
        );

        mostrarMensaje(
          error.message ||
          "No se pudo abrir la tarea"
        );

      }

    }



    // =====================================================
    // ELIMINAR TAREA
    // =====================================================

    async function eliminarTarea(
      id
    ) {

      const confirmar =
        window.confirm(
          "¿Seguro que quieres eliminar esta tarea?"
        );


      if (!confirmar) {

        return;

      }


      try {

        const respuesta =
          await peticionAPI(
            `/api/tareas/${id}`,
            {
              method: "DELETE"
            }
          );


        const datos =
          await respuesta.json();


        if (!respuesta.ok || !datos.ok) {

          throw new Error(
            datos.message ||
            "No se pudo eliminar la tarea"
          );

        }


        mostrarMensaje(
          "Tarea eliminada correctamente",
          "ok"
        );


        await cargarTareas();


      } catch (error) {

        console.error(
          "Error eliminando tarea:",
          error
        );

        mostrarMensaje(
          error.message ||
          "No se pudo eliminar la tarea"
        );

      }

    }



    // =====================================================
    // FILTROS
    // =====================================================

    filtroEstado.addEventListener(
      "change",
      renderizarTareas
    );


    filtroPrioridad.addEventListener(
      "change",
      renderizarTareas
    );


    filtroOficina.addEventListener(
      "change",
      renderizarTareas
    );


    filtroCliente.addEventListener(
      "change",
      renderizarTareas
    );


    filtroAsignado.addEventListener(
      "change",
      renderizarTareas
    );



    // =====================================================
    // BOTÓN NUEVA TAREA
    // =====================================================

    btnNuevaTarea.addEventListener(
      "click",
      abrirModalNuevaTarea
    );



    // =====================================================
    // OCULTAR CREACIÓN PARA CLIENTE
    // =====================================================

    if (
      usuario.rol === "CLIENTE"
    ) {

      btnNuevaTarea.style.display =
        "none";

      document
        .getElementById(
          "grupoEmpresaTarea"
        )
        .style.display =
          "none";

      document
        .getElementById(
          "grupoOficinaTarea"
        )
        .style.display =
          "none";

      document
        .getElementById(
          "grupoClienteTarea"
        )
        .style.display =
          "none";

      document
        .getElementById(
          "grupoAsignadoTarea"
        )
        .style.display =
          "none";

    }



    // =====================================================
    // CARGA INICIAL
    // =====================================================

    (async () => {

      await cargarTareas();

    })();

  </script>


</body>

</html>
