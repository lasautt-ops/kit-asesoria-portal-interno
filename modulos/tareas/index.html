
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tareas - Kit Gestión Asesoría</title>

  <link
    rel="stylesheet"
    href="../../css/estilos.css"
  >

</head>


<body>


  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

    <div class="portal-header-left">

      <a
        href="../../index.html"
        class="btn"
        style="display: inline-block; margin-bottom: 10px;"
      >
        ← Volver al panel
      </a>

      <h1>
        Tareas
      </h1>

      <p id="usuarioCabecera">
        Cargando...
      </p>

    </div>


    <div class="portal-header-right">

      <button
        id="cerrarSesion"
        class="btn btn-danger"
        type="button"
      >
        Cerrar sesión
      </button>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO
       ===================================================== -->

  <main class="portal-container">


    <section class="welcome-section">

      <h2>
        Gestión de tareas
      </h2>

      <p>
        Consulta y gestiona las tareas de la asesoría.
      </p>

    </section>



    <!-- =====================================================
         ACCIONES
         ===================================================== -->

    <section class="dashboard-section">

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 15px;
          flex-wrap: wrap;
          margin-bottom: 20px;
        "
      >

        <h2>
          Tareas
        </h2>

        <button
          id="btnNuevaTarea"
          class="btn"
          type="button"
        >
          + Nueva tarea
        </button>

      </div>



      <!-- =====================================================
           FILTROS
           ===================================================== -->

      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          gap: 15px;
          margin-bottom: 25px;
        "
      >

        <div>

          <label for="filtroEstado">
            Estado
          </label>

          <select
            id="filtroEstado"
            class="form-control"
          >

            <option value="">
              Todos
            </option>

            <option value="PENDIENTE">
              Pendiente
            </option>

            <option value="EN_PROCESO">
              En proceso
            </option>

            <option value="COMPLETADA">
              Completada
            </option>

            <option value="CANCELADA">
              Cancelada
            </option>

          </select>

        </div>


        <div>

          <label for="filtroPrioridad">
            Prioridad
          </label>

          <select
            id="filtroPrioridad"
            class="form-control"
          >

            <option value="">
              Todas
            </option>

            <option value="BAJA">
              Baja
            </option>

            <option value="MEDIA">
              Media
            </option>

            <option value="ALTA">
              Alta
            </option>

            <option value="URGENTE">
              Urgente
            </option>

          </select>

        </div>


        <div id="contenedorFiltroOficina">

          <label for="filtroOficina">
            Oficina
          </label>

          <select
            id="filtroOficina"
            class="form-control"
          >

            <option value="">
              Todas
            </option>

          </select>

        </div>


        <div id="contenedorFiltroCliente">

          <label for="filtroCliente">
            Cliente
          </label>

          <select
            id="filtroCliente"
            class="form-control"
          >

            <option value="">
              Todos
            </option>

          </select>

        </div>


        <div id="contenedorFiltroAsignado">

          <label for="filtroAsignado">
            Asignado a
          </label>

          <select
            id="filtroAsignado"
            class="form-control"
          >

            <option value="">
              Todos
            </option>

          </select>

        </div>

      </div>



      <!-- =====================================================
           MENSAJES
           ===================================================== -->

      <div id="mensajeTareas"></div>



      <!-- =====================================================
           LISTADO
           ===================================================== -->

      <div
        id="listaTareas"
        style="
          display: flex;
          flex-direction: column;
          gap: 15px;
        "
      >

      </div>

    </section>

  </main>



  <!-- =====================================================
       MODAL NUEVA / EDITAR TAREA
       ===================================================== -->

  <div
    id="modalTarea"
    class="modal"
    style="display: none;"
  >

    <div class="modal-content">

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
        "
      >

        <h2 id="tituloModalTarea">
          Nueva tarea
        </h2>

        <button
          id="cerrarModalTarea"
          class="btn"
          type="button"
        >
          ×
        </button>

      </div>



      <form id="formTarea">

        <input
          type="hidden"
          id="tareaId"
        >



        <div class="form-group">

          <label for="tituloTarea">
            Título
          </label>

          <input
            type="text"
            id="tituloTarea"
            required
          >

        </div>



        <div class="form-group">

          <label for="descripcionTarea">
            Descripción
          </label>

          <textarea
            id="descripcionTarea"
            rows="4"
          ></textarea>

        </div>



        <div class="form-group">

          <label for="prioridadTarea">
            Prioridad
          </label>

          <select
            id="prioridadTarea"
          >

            <option value="BAJA">
              Baja
            </option>

            <option
              value="MEDIA"
              selected
            >
              Media
            </option>

            <option value="ALTA">
              Alta
            </option>

            <option value="URGENTE">
              Urgente
            </option>

          </select>

        </div>



        <div
          class="form-group"
          id="grupoEstadoTarea"
        >

          <label for="estadoTarea">
            Estado
          </label>

          <select id="estadoTarea">

            <option value="PENDIENTE">
              Pendiente
            </option>

            <option value="EN_PROCESO">
              En proceso
            </option>

            <option value="COMPLETADA">
              Completada
            </option>

            <option value="CANCELADA">
              Cancelada
            </option>

          </select>

        </div>



        <div class="form-group">

          <label for="fechaLimiteTarea">
            Fecha límite
          </label>

          <input
            type="datetime-local"
            id="fechaLimiteTarea"
          >

        </div>



        <div
          class="form-group"
          id="grupoEmpresaTarea"
        >

          <label for="empresaTarea">
            Empresa
          </label>

          <select
            id="empresaTarea"
            required
          >

            <option value="">
              Cargando empresas...
            </option>

          </select>

        </div>



        <div class="form-group">

          <label for="oficinaTarea">
            Oficina
          </label>

          <select id="oficinaTarea">

            <option value="">
              Sin oficina
            </option>

          </select>

        </div>



        <div class="form-group">

          <label for="clienteTarea">
            Cliente
          </label>

          <select id="clienteTarea">

            <option value="">
              Sin cliente
            </option>

          </select>

        </div>



        <div
          class="form-group"
          id="grupoAsignadoTarea"
        >

          <label for="asignadoTarea">
            Asignar a
          </label>

          <select id="asignadoTarea">

            <option value="">
              Sin asignar
            </option>

          </select>

        </div>



        <div
          style="
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
          "
        >

          <button
            type="button"
            id="btnCancelarTarea"
            class="btn"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn"
          >
            Guardar tarea
          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =====================================================
       JAVASCRIPT COMÚN
       ===================================================== -->

  <script src="../../js/comun.js"></script>



  <!-- =====================================================
       JAVASCRIPT DEL MÓDULO
       ===================================================== -->

  <script>

    // =====================================================
    // SESIÓN
    // =====================================================

    if (!comprobarSesion()) {

      throw new Error(
        "Sesión no válida"
      );

    }


    const usuario = obtenerUsuario();



    // =====================================================
    // ELEMENTOS
    // =====================================================

    const listaTareas =
      document.getElementById("listaTareas");

    const mensajeTareas =
      document.getElementById("mensajeTareas");

    const modalTarea =
      document.getElementById("modalTarea");

    const formTarea =
      document.getElementById("formTarea");

    const empresaTarea =
      document.getElementById("empresaTarea");

    const oficinaTarea =
      document.getElementById("oficinaTarea");

    const clienteTarea =
      document.getElementById("clienteTarea");

    const asignadoTarea =
      document.getElementById("asignadoTarea");



    // =====================================================
    // CABECERA
    // =====================================================

    document
      .getElementById("usuarioCabecera")
      .textContent =
        `${usuario.nombre} · ${usuario.rol}`;



    document
      .getElementById("cerrarSesion")
      .addEventListener(
        "click",
        cerrarSesion
      );



    // =====================================================
    // TOKEN / PETICIONES
    // =====================================================

    function obtenerTokenLocal() {

      if (
        typeof obtenerToken === "function"
      ) {

        return obtenerToken();

      }

      return (
        localStorage.getItem("token") ||
        localStorage.getItem("accessToken") ||
        ""
      );

    }



    async function apiFetch(
      url,
      opciones = {}
    ) {

      const token =
        obtenerTokenLocal();

      const headers = {
        ...(opciones.headers || {}),
        "Content-Type": "application/json"
      };


      if (token) {

        headers.Authorization =
          `Bearer ${token}`;

      }


      const respuesta =
        await fetch(
          url,
          {
            ...opciones,
            headers
          }
        );


      let datos = {};

      try {

        datos =
          await respuesta.json();

      } catch (error) {

        datos = {};

      }


      if (!respuesta.ok) {

        throw new Error(
          datos.message ||
          "Error en la petición"
        );

      }


      return datos;

    }



    // =====================================================
    // VARIABLES
    // =====================================================

    let empresas = [];

    let oficinas = [];

    let clientes = [];

    let trabajadores = [];

    let tareas = [];



    // =====================================================
    // CARGAR EMPRESAS
    // =====================================================

    async function cargarEmpresas() {

      try {

        const datos =
          await apiFetch(
            "../../api/empresas"
          );

        empresas =
          Array.isArray(datos.empresas)
            ? datos.empresas
            : [];


        empresaTarea.innerHTML = "";


        const opcionInicial =
          document.createElement("option");

        opcionInicial.value = "";

        opcionInicial.textContent =
          "Seleccionar empresa";

        empresaTarea.appendChild(
          opcionInicial
        );


        empresas.forEach(
          (empresa) => {

            const opcion =
              document.createElement("option");

            opcion.value =
              empresa.id;

            opcion.textContent =
              empresa.nombre;

            empresaTarea.appendChild(
              opcion
            );

          }
        );


        // ADMIN y demás usuarios con una única empresa
        // pueden tenerla seleccionada automáticamente.

        if (
          usuario.empresaId &&
          empresas.some(
            (empresa) =>
              empresa.id === usuario.empresaId
          )
        ) {

          empresaTarea.value =
            usuario.empresaId;

          await cargarDatosEmpresa(
            usuario.empresaId
          );

        } else if (
          empresas.length === 1
        ) {

          empresaTarea.value =
            empresas[0].id;

          await cargarDatosEmpresa(
            empresas[0].id
          );

        }

      } catch (error) {

        console.error(
          "Error cargando empresas:",
          error
        );

        empresaTarea.innerHTML = "";

        const opcion =
          document.createElement("option");

        opcion.value = "";

        opcion.textContent =
          "No se pudieron cargar las empresas";

        empresaTarea.appendChild(
          opcion
        );

      }

    }



    // =====================================================
    // CARGAR OFICINAS
    // =====================================================

    async function cargarOficinas(
      empresaId
    ) {

      oficinaTarea.innerHTML = `
        <option value="">
          Cargando oficinas...
        </option>
      `;


      try {

        if (!empresaId) {

          oficinaTarea.innerHTML = `
            <option value="">
              Sin oficina
            </option>
          `;

          return;

        }


        const datos =
          await apiFetch(
            `../../api/empresas/${empresaId}/oficinas`
          );


        oficinas =
          Array.isArray(datos.oficinas)
            ? datos.oficinas
            : [];


        oficinaTarea.innerHTML = `
          <option value="">
            Sin oficina
          </option>
        `;


        oficinas.forEach(
          (oficina) => {

            const opcion =
              document.createElement("option");

            opcion.value =
              oficina.id;

            opcion.textContent =
              oficina.nombre;

            oficinaTarea.appendChild(
              opcion
            );

          }
        );


      } catch (error) {

        console.error(
          "Error cargando oficinas:",
          error
        );

        oficinaTarea.innerHTML = `
          <option value="">
            Sin oficina
          </option>
        `;

      }

    }



    // =====================================================
    // CARGAR CLIENTES
    // =====================================================

    async function cargarClientes(
      empresaId,
      oficinaId = ""
    ) {

      clienteTarea.innerHTML = `
        <option value="">
          Cargando clientes...
        </option>
      `;


      try {

        const datos =
          await apiFetch(
            "../../api/clientes"
          );


        let lista =
          Array.isArray(datos.clientes)
            ? datos.clientes
            : [];


        lista =
          lista.filter(
            (cliente) =>
              !empresaId ||
              cliente.empresaId === empresaId
          );


        if (oficinaId) {

          lista =
            lista.filter(
              (cliente) =>
                cliente.oficinaId === oficinaId
            );

        }


        clientes =
          lista;


        clienteTarea.innerHTML = `
          <option value="">
            Sin cliente
          </option>
        `;


        clientes.forEach(
          (cliente) => {

            const opcion =
              document.createElement("option");

            opcion.value =
              cliente.id;

            opcion.textContent =
              cliente.nombre;

            clienteTarea.appendChild(
              opcion
            );

          }
        );


      } catch (error) {

        console.error(
          "Error cargando clientes:",
          error
        );

        clienteTarea.innerHTML = `
          <option value="">
            Sin cliente
          </option>
        `;

      }

    }



    // =====================================================
    // CARGAR TRABAJADORES
    // =====================================================

    async function cargarTrabajadores(
      empresaId,
      oficinaId = ""
    ) {

      asignadoTarea.innerHTML = `
        <option value="">
          Cargando usuarios...
        </option>
      `;


      try {

        const datos =
          await apiFetch(
            "../../api/trabajadores"
          );


        let lista =
          Array.isArray(datos.trabajadores)
            ? datos.trabajadores
            : [];


        lista =
          lista.filter(
            (trabajador) =>
              !empresaId ||
              trabajador.empresaId === empresaId
          );


        if (oficinaId) {

          lista =
            lista.filter(
              (trabajador) =>
                trabajador.oficinaId === oficinaId
            );

        }


        trabajadores =
          lista;


        asignadoTarea.innerHTML = `
          <option value="">
            Sin asignar
          </option>
        `;


        trabajadores.forEach(
          (trabajador) => {

            const opcion =
              document.createElement("option");


            const usuarioTrabajador =
              trabajador.usuario ||
              trabajador;


            const id =
              usuarioTrabajador.id ||
              trabajador.usuarioId;


            const nombre =
              usuarioTrabajador.nombre ||
              trabajador.nombre ||
              "Trabajador";


            if (!id) {

              return;

            }


            opcion.value =
              id;

            opcion.textContent =
              nombre;

            asignadoTarea.appendChild(
              opcion
            );

          }
        );


      } catch (error) {

        console.error(
          "Error cargando trabajadores:",
          error
        );

        asignadoTarea.innerHTML = `
          <option value="">
            Sin asignar
          </option>
        `;

      }

    }



    // =====================================================
    // CARGAR DATOS DE EMPRESA
    // =====================================================

    async function cargarDatosEmpresa(
      empresaId
    ) {

      if (!empresaId) {

        oficinaTarea.innerHTML = `
          <option value="">
            Sin oficina
          </option>
        `;

        clienteTarea.innerHTML = `
          <option value="">
            Sin cliente
          </option>
        `;

        asignadoTarea.innerHTML = `
          <option value="">
            Sin asignar
          </option>
        `;

        return;

      }


      await cargarOficinas(
        empresaId
      );


      await cargarClientes(
        empresaId
      );


      await cargarTrabajadores(
        empresaId
      );

    }



    // =====================================================
    // CAMBIO DE EMPRESA
    // =====================================================

    empresaTarea.addEventListener(
      "change",
      async () => {

        const empresaId =
          empresaTarea.value;


        await cargarDatosEmpresa(
          empresaId
        );

      }
    );



    // =====================================================
    // CAMBIO DE OFICINA
    // =====================================================

    oficinaTarea.addEventListener(
      "change",
      async () => {

        const empresaId =
          empresaTarea.value;

        const oficinaId =
          oficinaTarea.value;


        await cargarClientes(
          empresaId,
          oficinaId
        );


        await cargarTrabajadores(
          empresaId,
          oficinaId
        );

      }
    );



    // =====================================================
    // CARGAR TAREAS
    // =====================================================

    async function cargarTareas() {

      listaTareas.innerHTML = `
        <p>
          Cargando tareas...
        </p>
      `;


      try {

        const datos =
          await apiFetch(
            "../../api/tareas"
          );


        tareas =
          Array.isArray(datos.tareas)
            ? datos.tareas
            : [];


        renderizarTareas();


      } catch (error) {

        console.error(
          "Error cargando tareas:",
          error
        );


        listaTareas.innerHTML = `
          <p>
            No se pudieron cargar las tareas.
          </p>
        `;

      }

    }



    // =====================================================
    // RENDERIZAR TAREAS
    // =====================================================

    function renderizarTareas() {

      const estadoFiltro =
        document.getElementById(
          "filtroEstado"
        ).value;


      const prioridadFiltro =
        document.getElementById(
          "filtroPrioridad"
        ).value;


      const oficinaFiltro =
        document.getElementById(
          "filtroOficina"
        ).value;


      const clienteFiltro =
        document.getElementById(
          "filtroCliente"
        ).value;


      const asignadoFiltro =
        document.getElementById(
          "filtroAsignado"
        ).value;


      let lista =
        [...tareas];


      if (estadoFiltro) {

        lista =
          lista.filter(
            (tarea) =>
              tarea.estado === estadoFiltro
          );

      }


      if (prioridadFiltro) {

        lista =
          lista.filter(
            (tarea) =>
              tarea.prioridad === prioridadFiltro
          );

      }


      if (oficinaFiltro) {

        lista =
          lista.filter(
            (tarea) =>
              tarea.oficinaId === oficinaFiltro
          );

      }


      if (clienteFiltro) {

        lista =
          lista.filter(
            (tarea) =>
              tarea.clienteId === clienteFiltro
          );

      }


      if (asignadoFiltro) {

        lista =
          lista.filter(
            (tarea) =>
              tarea.asignadoAUsuarioId === asignadoFiltro
          );

      }


      listaTareas.innerHTML = "";


      if (!lista.length) {

        listaTareas.innerHTML = `
          <div
            style="
              padding: 25px;
              text-align: center;
              border: 1px solid #ddd;
              border-radius: 8px;
            "
          >
            No hay tareas para mostrar.
          </div>
        `;

        return;

      }


      lista.forEach(
        (tarea) => {

          const tarjeta =
            document.createElement("div");


          tarjeta.style.cssText = `
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
          `;


          const fecha =
            tarea.fechaLimite
              ? new Date(
                  tarea.fechaLimite
                ).toLocaleString(
                  "es-ES"
                )
              : "Sin fecha límite";


          const empresa =
            tarea.empresa?.nombre ||
            "Sin empresa";


          const oficina =
            tarea.oficina?.nombre ||
            "Sin oficina";


          const cliente =
            tarea.cliente?.nombre ||
            "Sin cliente";


          const asignado =
            tarea.asignadoAUsuario?.nombre ||
            "Sin asignar";


          tarjeta.innerHTML = `

            <div
              style="
                display: flex;
                justify-content: space-between;
                gap: 15px;
                flex-wrap: wrap;
              "
            >

              <div>

                <h3 style="margin-top: 0;">
                  ${escapeHtml(
                    tarea.titulo
                  )}
                </h3>

                <p>
                  ${escapeHtml(
                    tarea.descripcion ||
                    "Sin descripción"
                  )}
                </p>

              </div>

            </div>


            <div
              style="
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(180px, 1fr));
                gap: 10px;
                margin-top: 15px;
              "
            >

              <div>
                <strong>Estado:</strong>
                ${escapeHtml(
                  tarea.estado ||
                  "PENDIENTE"
                )}
              </div>

              <div>
                <strong>Prioridad:</strong>
                ${escapeHtml(
                  tarea.prioridad ||
                  "MEDIA"
                )}
              </div>

              <div>
                <strong>Empresa:</strong>
                ${escapeHtml(
                  empresa
                )}
              </div>

              <div>
                <strong>Oficina:</strong>
                ${escapeHtml(
                  oficina
                )}
              </div>

              <div>
                <strong>Cliente:</strong>
                ${escapeHtml(
                  cliente
                )}
              </div>

              <div>
                <strong>Asignado a:</strong>
                ${escapeHtml(
                  asignado
                )}
              </div>

              <div>
                <strong>Fecha límite:</strong>
                ${escapeHtml(
                  fecha
                )}
              </div>

            </div>


            <div
              style="
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 20px;
                flex-wrap: wrap;
              "
            >

              ${puedeEditarTarea(tarea)
                ? `
                  <button
                    type="button"
                    class="btn btn-editar-tarea"
                    data-id="${tarea.id}"
                  >
                    Editar
                  </button>
                `
                : ""
              }

              ${puedeEliminarTarea(tarea)
                ? `
                  <button
                    type="button"
                    class="btn btn-danger btn-eliminar-tarea"
                    data-id="${tarea.id}"
                  >
                    Eliminar
                  </button>
                `
                : ""
              }

            </div>

          `;


          listaTareas.appendChild(
            tarjeta
          );

        }
      );


      document
        .querySelectorAll(
          ".btn-editar-tarea"
        )
        .forEach(
          (boton) => {

            boton.addEventListener(
              "click",
              () => {

                const tarea =
                  tareas.find(
                    (item) =>
                      item.id ===
                      boton.dataset.id
                  );


                if (tarea) {

                  abrirEditarTarea(
                    tarea
                  );

                }

              }
            );

          }
        );


      document
        .querySelectorAll(
          ".btn-eliminar-tarea"
        )
        .forEach(
          (boton) => {

            boton.addEventListener(
              "click",
              () => {

                eliminarTarea(
                  boton.dataset.id
                );

              }
            );

          }
        );

    }



    // =====================================================
    // PERMISOS
    // =====================================================

    function puedeEditarTarea(
      tarea
    ) {

      if (
        usuario.rol === "SUPERADMIN" ||
        usuario.rol === "ADMIN" ||
        usuario.rol === "DIRECTOR"
      ) {

        return true;

      }


      if (
        usuario.rol === "TRABAJADOR"
      ) {

        return (
          tarea.asignadoAUsuarioId ===
          usuario.id
        );

      }


      if (
        usuario.rol === "CLIENTE"
      ) {

        return (
          tarea.cliente &&
          tarea.cliente.usuarioId ===
          usuario.id
        );

      }


      return false;

    }



    function puedeEliminarTarea(
      tarea
    ) {

      if (
        usuario.rol === "SUPERADMIN"
      ) {

        return true;

      }


      if (
        usuario.rol === "ADMIN"
      ) {

        return (
          tarea.empresaId ===
          usuario.empresaId
        );

      }


      if (
        usuario.rol === "DIRECTOR"
      ) {

        return (
          tarea.empresaId ===
            usuario.empresaId &&
          tarea.oficinaId ===
            usuario.oficinaId
        );

      }


      return false;

    }



    // =====================================================
    // ABRIR NUEVA TAREA
    // =====================================================

    document
      .getElementById("btnNuevaTarea")
      .addEventListener(
        "click",
        async () => {

          formTarea.reset();


          document
            .getElementById(
              "tareaId"
            )
            .value = "";


          document
            .getElementById(
              "tituloModalTarea"
            )
            .textContent =
              "Nueva tarea";


          document
            .getElementById(
              "estadoTarea"
            )
            .value =
              "PENDIENTE";


          document
            .getElementById(
              "prioridadTarea"
            )
            .value =
              "MEDIA";


          await cargarEmpresas();


          if (
            usuario.rol === "CLIENTE"
          ) {

            return;

          }


          modalTarea.style.display =
            "flex";

        }
      );



    // =====================================================
    // ABRIR EDICIÓN
    // =====================================================

    async function abrirEditarTarea(
      tarea
    ) {

      document
        .getElementById(
          "tareaId"
        )
        .value =
          tarea.id;


      document
        .getElementById(
          "tituloModalTarea"
        )
        .textContent =
          "Editar tarea";


      document
        .getElementById(
          "tituloTarea"
        )
        .value =
          tarea.titulo || "";


      document
        .getElementById(
          "descripcionTarea"
        )
        .value =
          tarea.descripcion || "";


      document
        .getElementById(
          "prioridadTarea"
        )
        .value =
          tarea.prioridad || "MEDIA";


      document
        .getElementById(
          "estadoTarea"
        )
        .value =
          tarea.estado || "PENDIENTE";


      if (tarea.fechaLimite) {

        const fecha =
          new Date(
            tarea.fechaLimite
          );


        const local =
          new Date(
            fecha.getTime() -
            fecha.getTimezoneOffset() *
              60000
          )
            .toISOString()
            .slice(
              0,
              16
            );


        document
          .getElementById(
            "fechaLimiteTarea"
          )
          .value =
            local;

      } else {

        document
          .getElementById(
            "fechaLimiteTarea"
          )
          .value = "";

      }


      if (
        usuario.rol === "CLIENTE"
      ) {

        ocultarCamposCliente();

        modalTarea.style.display =
          "flex";

        return;

      }


      mostrarCamposGestion();


      await cargarEmpresas();


      if (tarea.empresaId) {

        empresaTarea.value =
          tarea.empresaId;


        await cargarDatosEmpresa(
          tarea.empresaId
        );

      }


      if (tarea.oficinaId) {

        oficinaTarea.value =
          tarea.oficinaId;


        await cargarClientes(
          tarea.empresaId,
          tarea.oficinaId
        );


        await cargarTrabajadores(
          tarea.empresaId,
          tarea.oficinaId
        );

      }


      if (tarea.clienteId) {

        clienteTarea.value =
          tarea.clienteId;

      }


      if (
        tarea.asignadoAUsuarioId
      ) {

        asignadoTarea.value =
          tarea.asignadoAUsuarioId;

      }


      modalTarea.style.display =
        "flex";

    }



    // =====================================================
    // CLIENTE
    // =====================================================

    function ocultarCamposCliente() {

      document
        .getElementById(
          "grupoEstadoTarea"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "grupoEmpresaTarea"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "oficinaTarea"
        )
        .closest(".form-group")
        .style.display =
          "none";


      document
        .getElementById(
          "clienteTarea"
        )
        .closest(".form-group")
        .style.display =
          "none";


      document
        .getElementById(
          "grupoAsignadoTarea"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "tituloTarea"
        )
        .disabled = true;


      document
        .getElementById(
          "descripcionTarea"
        )
        .disabled = true;


      document
        .getElementById(
          "prioridadTarea"
        )
        .disabled = true;


      document
        .getElementById(
          "fechaLimiteTarea"
        )
        .disabled = true;

    }



    function mostrarCamposGestion() {

      document
        .getElementById(
          "grupoEmpresaTarea"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "oficinaTarea"
        )
        .closest(".form-group")
        .style.display =
          "block";


      document
        .getElementById(
          "clienteTarea"
        )
        .closest(".form-group")
        .style.display =
          "block";


      document
        .getElementById(
          "grupoAsignadoTarea"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "tituloTarea"
        )
        .disabled = false;


      document
        .getElementById(
          "descripcionTarea"
        )
        .disabled = false;


      document
        .getElementById(
          "prioridadTarea"
        )
        .disabled = false;


      document
        .getElementById(
          "fechaLimiteTarea"
        )
        .disabled = false;

    }



    // =====================================================
    // GUARDAR TAREA
    // =====================================================

    formTarea.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const tareaId =
          document
            .getElementById(
              "tareaId"
            )
            .value;


        const titulo =
          document
            .getElementById(
              "tituloTarea"
            )
            .value
            .trim();


        const descripcion =
          document
            .getElementById(
              "descripcionTarea"
            )
            .value
            .trim();


        const estado =
          document
            .getElementById(
              "estadoTarea"
            )
            .value;


        const prioridad =
          document
            .getElementById(
              "prioridadTarea"
            )
            .value;


        const fechaLimite =
          document
            .getElementById(
              "fechaLimiteTarea"
            )
            .value;


        // =================================================
        // CLIENTE
        // =================================================

        if (
          usuario.rol === "CLIENTE"
        ) {

          try {

            await apiFetch(
              `../../api/tareas/${tareaId}`,
              {
                method: "PATCH",
                body: JSON.stringify({
                  estado
                })
              }
            );


            cerrarModal();


            await cargarTareas();


          } catch (error) {

            alert(
              error.message
            );

          }


          return;

        }



        // =================================================
        // CREAR / EDITAR
        // =================================================

        const empresaId =
          empresaTarea.value;


        const oficinaId =
          oficinaTarea.value;


        const clienteId =
          clienteTarea.value;


        const asignadoAUsuarioId =
          asignadoTarea.value;


        if (!titulo) {

          alert(
            "El título es obligatorio."
          );

          return;

        }


        if (!empresaId) {

          alert(
            "Debes seleccionar una empresa."
          );

          return;

        }


        const datos = {

          titulo,

          descripcion:
            descripcion || null,

          prioridad,

          fechaLimite:
            fechaLimite || null,

          empresaId,

          oficinaId:
            oficinaId || null,

          clienteId:
            clienteId || null,

          asignadoAUsuarioId:
            asignadoAUsuarioId || null

        };


        try {

          if (tareaId) {

            datos.estado =
              estado;


            await apiFetch(
              `../../api/tareas/${tareaId}`,
              {
                method: "PATCH",
                body: JSON.stringify(
                  datos
                )
              }
            );

          } else {

            await apiFetch(
              "../../api/tareas",
              {
                method: "POST",
                body: JSON.stringify(
                  datos
                )
              }
            );

          }


          cerrarModal();


          await cargarTareas();


        } catch (error) {

          console.error(
            "Error guardando tarea:",
            error
          );


          alert(
            error.message
          );

        }

      }
    );



    // =====================================================
    // ELIMINAR TAREA
    // =====================================================

    async function eliminarTarea(
      id
    ) {

      const confirmar =
        confirm(
          "¿Seguro que quieres eliminar esta tarea?"
        );


      if (!confirmar) {

        return;

      }


      try {

        await apiFetch(
          `../../api/tareas/${id}`,
          {
            method: "DELETE"
          }
        );


        await cargarTareas();


      } catch (error) {

        console.error(
          "Error eliminando tarea:",
          error
        );


        alert(
          error.message
        );

      }

    }



    // =====================================================
    // CERRAR MODAL
    // =====================================================

    function cerrarModal() {

      modalTarea.style.display =
        "none";


      formTarea.reset();


      document
        .getElementById(
          "tareaId"
        )
        .value = "";


      document
        .getElementById(
          "tituloModalTarea"
        )
        .textContent =
          "Nueva tarea";


      mostrarCamposGestion();

    }



    document
      .getElementById(
        "cerrarModalTarea"
      )
      .addEventListener(
        "click",
        cerrarModal
      );


    document
      .getElementById(
        "btnCancelarTarea"
      )
      .addEventListener(
        "click",
        cerrarModal
      );



    // =====================================================
    // FILTROS
    // =====================================================

    [
      "filtroEstado",
      "filtroPrioridad",
      "filtroOficina",
      "filtroCliente",
      "filtroAsignado"
    ]
      .forEach(
        (id) => {

          document
            .getElementById(id)
            .addEventListener(
              "change",
              renderizarTareas
            );

        }
      );



    // =====================================================
    // FILTROS DINÁMICOS
    // =====================================================

    function cargarFiltros() {

      const filtroOficina =
        document.getElementById(
          "filtroOficina"
        );


      const filtroCliente =
        document.getElementById(
          "filtroCliente"
        );


      const filtroAsignado =
        document.getElementById(
          "filtroAsignado"
        );


      const oficinasUnicas =
        new Map();


      const clientesUnicos =
        new Map();


      const asignadosUnicos =
        new Map();


      tareas.forEach(
        (tarea) => {

          if (
            tarea.oficinaId &&
            tarea.oficina
          ) {

            oficinasUnicas.set(
              tarea.oficinaId,
              tarea.oficina.nombre
            );

          }


          if (
            tarea.clienteId &&
            tarea.cliente
          ) {

            clientesUnicos.set(
              tarea.clienteId,
              tarea.cliente.nombre
            );

          }


          if (
            tarea.asignadoAUsuarioId &&
            tarea.asignadoAUsuario
          ) {

            asignadosUnicos.set(
              tarea.asignadoAUsuarioId,
              tarea.asignadoAUsuario.nombre
            );

          }

        }
      );


      filtroOficina.innerHTML = `
        <option value="">
          Todas
        </option>
      `;


      oficinasUnicas.forEach(
        (nombre, id) => {

          filtroOficina.innerHTML += `
            <option value="${id}">
              ${escapeHtml(nombre)}
            </option>
          `;

        }
      );


      filtroCliente.innerHTML = `
        <option value="">
          Todos
        </option>
      `;


      clientesUnicos.forEach(
        (nombre, id) => {

          filtroCliente.innerHTML += `
            <option value="${id}">
              ${escapeHtml(nombre)}
            </option>
          `;

        }
      );


      filtroAsignado.innerHTML = `
        <option value="">
          Todos
        </option>
      `;


      asignadosUnicos.forEach(
        (nombre, id) => {

          filtroAsignado.innerHTML += `
            <option value="${id}">
              ${escapeHtml(nombre)}
            </option>
          `;

        }
      );

    }



    // =====================================================
    // ESCAPAR HTML
    // =====================================================

    function escapeHtml(
      valor
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        valor == null
          ? ""
          : String(valor);


      return div.innerHTML;

    }



    // =====================================================
    // ACTUALIZAR FILTROS AL CARGAR
    // =====================================================

    const cargarTareasOriginal =
      cargarTareas;


    cargarTareas =
      async function () {

        await cargarTareasOriginal();

        cargarFiltros();

        renderizarTareas();

      };



    // =====================================================
    // INICIALIZACIÓN
    // =====================================================

    async function iniciarModulo() {

      // Ocultar opciones que no corresponden al rol.

      if (
        usuario.rol === "TRABAJADOR"
      ) {

        document
          .getElementById(
            "contenedorFiltroOficina"
          )
          .style.display =
            "none";

        document
          .getElementById(
            "contenedorFiltroAsignado"
          )
          .style.display =
            "none";

      }


      if (
        usuario.rol === "CLIENTE"
      ) {

        document
          .getElementById(
            "btnNuevaTarea"
          )
          .style.display =
            "none";

        document
          .getElementById(
            "contenedorFiltroOficina"
          )
          .style.display =
            "none";

        document
          .getElementById(
            "contenedorFiltroAsignado"
          )
          .style.display =
            "none";

        document
          .getElementById(
            "contenedorFiltroCliente"
          )
          .style.display =
            "none";

      }


      if (
        usuario.rol !== "SUPERADMIN" &&
        usuario.rol !== "ADMIN" &&
        usuario.rol !== "DIRECTOR"
      ) {

        document
          .getElementById(
            "grupoEmpresaTarea"
          )
          .style.display =
            "none";

      }


      await cargarTareas();

    }


    iniciarModulo();

  </script>
