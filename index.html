<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gestión Interna - Kit Gestión Asesoría</title>

  <link
    rel="stylesheet"
    href="css/estilos.css"
  >

</head>


<body>


  <!-- =====================================================
       CABECERA
       ===================================================== -->

  <header class="portal-header">

    <div class="portal-header-left">

      <h1>
        Gestión Interna
      </h1>

      <p id="usuarioCabecera">
        Cargando...
      </p>

    </div>


    <div class="portal-header-right">

      <button
        id="cerrarSesion"
        class="btn btn-danger"
        type="button"
      >
        Cerrar sesión
      </button>

    </div>

  </header>



  <!-- =====================================================
       CONTENIDO
       ===================================================== -->

  <main class="portal-container">


    <section class="welcome-section">

      <h2 id="bienvenida">
        Bienvenido
      </h2>

      <p>
        Portal de gestión interna de la asesoría.
      </p>

    </section>



    <section class="dashboard-section">

      <h2>
        Panel de gestión
      </h2>

      <p>
        Los módulos de gestión interna se irán incorporando
        desde aquí.
      </p>

    </section>


  </main>



  <!-- =====================================================
       PIE
       ===================================================== -->

  <footer class="portal-footer">

    Kit Gestión Asesoría · Gestión Interna

  </footer>



  <!-- =====================================================
       JAVASCRIPT COMÚN
       ===================================================== -->

  <script src="js/comun.js"></script>



  <!-- =====================================================
       JAVASCRIPT DEL PORTAL
       ===================================================== -->

  <script>

    // =====================================================
    // COMPROBAR SESIÓN
    // =====================================================

    if (!comprobarSesion()) {

      throw new Error(
        "Sesión no válida"
      );

    }


    // =====================================================
    // COMPROBAR ACCESO INTERNO
    // =====================================================

    if (!comprobarAccesoInterno()) {

      throw new Error(
        "Usuario sin permisos para el portal interno"
      );

    }


    // =====================================================
    // OBTENER USUARIO
    // =====================================================

    const usuario =
      obtenerUsuario();


    // =====================================================
    // MOSTRAR USUARIO
    // =====================================================

    document
      .getElementById(
        "usuarioCabecera"
      )
      .textContent =
        `${usuario.nombre} · ${usuario.rol}`;


    document
      .getElementById(
        "bienvenida"
      )
      .textContent =
        `Bienvenido, ${usuario.nombre}`;


    // =====================================================
    // CERRAR SESIÓN
    // =====================================================

    document
      .getElementById(
        "cerrarSesion"
      )
      .addEventListener(
        "click",
        cerrarSesion
      );

  </script>


</body>

</html>
