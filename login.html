
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Acceso - Gestión Interna</title>

  <link
    rel="stylesheet"
    href="css/estilos.css"
  >

</head>


<body>


  <main class="portal-container login-container">


    <!-- =================================================
         CABECERA
         ================================================= -->

    <section class="welcome-section login-header">

      <div class="login-icon">
        🔐
      </div>

      <h2>
        Gestión Interna
      </h2>

      <p>
        Accede al panel de gestión de la asesoría.
      </p>

    </section>



    <!-- =================================================
         FORMULARIO
         ================================================= -->

    <section class="login-card">

      <h3>
        Iniciar sesión
      </h3>


      <form id="loginForm">


        <!-- EMAIL -->

        <div class="login-field">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >

        </div>



        <!-- CONTRASEÑA -->

        <div class="login-field login-password-field">

          <label for="password">
            Contraseña
          </label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >

        </div>



        <!-- BOTÓN -->

        <button
          type="submit"
          id="loginButton"
          class="btn btn-primary login-button"
        >
          Iniciar sesión
        </button>


        <!-- MENSAJE -->

        <p
          id="loginMessage"
          class="message login-message"
        ></p>


      </form>

    </section>


  </main>



  <!-- =================================================
       JAVASCRIPT COMÚN
       ================================================= -->

  <script src="js/comun.js"></script>



  <!-- =================================================
       LOGIN
       ================================================= -->

  <script>

    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        loginMessage.textContent =
          "Iniciando sesión...";


        loginButton.disabled =
          true;

        loginButton.textContent =
          "Accediendo...";


        try {

          const respuesta =
            await fetch(
              `${API_URL}/api/login`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email,
                  password
                })
              }
            );


          const datos =
            await respuesta.json();


          if (
            !respuesta.ok ||
            !datos.ok
          ) {

            loginMessage.textContent =
              datos.message ||
              "Email o contraseña incorrectos";


            loginButton.disabled =
              false;

            loginButton.textContent =
              "Iniciar sesión";

            return;
          }


          // =============================================
          // COMPROBAR QUE ES USUARIO INTERNO
          // =============================================

          const rolesPermitidos = [
            "SUPERADMIN",
            "ADMIN",
            "DIRECTOR",
            "TRABAJADOR"
          ];


          if (
            !datos.usuario ||
            !rolesPermitidos.includes(
              datos.usuario.rol
            )
          ) {

            loginMessage.textContent =
              "Este usuario no tiene acceso al portal interno.";


            loginButton.disabled =
              false;

            loginButton.textContent =
              "Iniciar sesión";

            return;
          }


          // =============================================
          // GUARDAR SESIÓN
          // =============================================

          localStorage.setItem(
            "token",
            datos.token
          );


          localStorage.setItem(
            "usuario",
            JSON.stringify(
              datos.usuario
            )
          );


          // =============================================
          // ACCESO AL PORTAL
          // =============================================

          window.location.href =
            "index.html";


        } catch (error) {

          console.error(
            "Error en login:",
            error
          );


          loginMessage.textContent =
            "No se ha podido conectar con el servidor";


          loginButton.disabled =
            false;

          loginButton.textContent =
            "Iniciar sesión";
        }

      }
    );

  </script>


</body>

</html>
